  <!-- ============================================================
       SCRIPT KUIS
       ============================================================ -->
  <script>
    // ============================================================
    // STATE
    // ============================================================
    let currentRole = 'siswa';
    let currentSiswa = null;
    let daftarKuis = [];
    let kuisAktif = null;
    let soalList = [];
    let jawabanUser = {};    // { soalId: 'A' | 'B' | 'C' | 'D' }
    let currentIndex = 0;
    let timerInterval = null;
    let waktuTersisa = 0;    // dalam detik

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      if (!toast || !msg) { alert(message); return; }
      const icon = toast.querySelector('i');
      toast.className = 'toast ' + type;
      msg.textContent = message;
      const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      if (icon) icon.className = 'fas ' + (icons[type] || icons.info);
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============================================================
    // CEK ROLE
    // ============================================================
    async function cekRole() {
      const sessionSiswa = localStorage.getItem('siswa_session');
      if (sessionSiswa) {
        try {
          currentSiswa = JSON.parse(sessionSiswa);
          currentRole = 'siswa';
          document.getElementById('user-role').textContent = currentSiswa.nama || 'Siswa';
          document.getElementById('back-btn').href = 'dashboard-siswa.html';
          return;
        } catch (e) { /* lanjut */ }
      }

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const { data: profile } = await supabaseClient
          .from('profiles').select('*').eq('id', user.id).single();

        if (profile?.role === 'guru') {
          currentRole = 'guru';
          document.getElementById('user-role').textContent = profile.full_name || 'Guru';
          document.getElementById('back-btn').href = 'dashboard-guru.html';
          document.getElementById('btn-add-kuis').style.display = 'inline-flex';
          return;
        }
      }

      window.location.href = 'index.html';
    }

    // ============================================================
    // LOAD DAFTAR KUIS
    // ============================================================
    async function loadKuis() {
      const list = document.getElementById('kuis-list');
      list.innerHTML = `
        <div class="kuis-card">
          <div class="skeleton" style="height:52px;width:52px;border-radius:14px;"></div>
          <div class="skeleton" style="height:20px;width:80%;"></div>
          <div class="skeleton" style="height:14px;width:100%;"></div>
        </div>`;

      try {
        const { data, error } = await supabaseClient
          .from('kuis')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        daftarKuis = (data || []).filter(k =>
          currentRole === 'guru' || k.status === 'aktif'
        );

        if (daftarKuis.length === 0) {
          list.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <i class="fas fa-inbox"></i>
              <h3>Belum Ada Kuis</h3>
              <p>${currentRole === 'guru' ? 'Klik "Buat Kuis Baru" untuk membuat kuis pertama.' : 'Kuis akan muncul di sini setelah ditambahkan oleh guru.'}</p>
            </div>`;
          return;
        }

        // Cek kuis yang sudah dikerjakan siswa
        let selesaiSet = new Set();
        if (currentRole === 'siswa' && currentSiswa) {
          const { data: nilaiData } = await supabaseClient
            .from('nilai')
            .select('materi')
            .eq('nama_siswa', currentSiswa.nama)
            .eq('kelas', currentSiswa.kelas);

          selesaiSet = new Set((nilaiData || []).map(n => n.materi));
        }

        list.innerHTML = daftarKuis.map(k => {
          const selesai = selesaiSet.has(k.judul);
          return `
            <div class="kuis-card">
              <div class="kuis-card-header">
                <div class="kuis-icon"><i class="fas fa-clipboard-question"></i></div>
                <span class="kuis-status ${selesai ? 'selesai' : 'tersedia'}">
                  ${selesai ? '<i class="fas fa-check"></i> Selesai' : '<i class="fas fa-play"></i> Tersedia'}
                </span>
              </div>
              <h3>${k.judul}</h3>
              <p class="desc">${k.deskripsi || 'Kuis pilihan ganda untuk menguji pemahaman K3.'}</p>
              <div class="kuis-meta">
                <span class="kuis-meta-item"><i class="fas fa-list-ol"></i> ${k.jumlah_soal || 0} soal</span>
                <span class="kuis-meta-item"><i class="fas fa-clock"></i> ${k.durasi || 10} menit</span>
                <span class="kuis-meta-item"><i class="fas fa-star"></i> Nilai ≥ 75</span>
              </div>
              <div class="kuis-actions">
                ${currentRole === 'guru' ? `
                  <button class="btn btn-ghost" onclick="event.stopPropagation();hapusKuis('${k.id}')">
                    <i class="fas fa-trash"></i> Hapus
                  </button>
                ` : ''}
                <button class="btn btn-orange" onclick="mulaiKuis('${k.id}')">
                  <i class="fas fa-play"></i> ${selesai ? 'Kerjakan Lagi' : 'Mulai Kuis'}
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Gagal load kuis:', err);
        list.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Gagal Memuat Kuis</h3>
            <p>Terjadi kesalahan saat memuat data.</p>
          </div>`;
      }
    }

    // ============================================================
    // MULAI KUIS
    // ============================================================
    async function mulaiKuis(kuisId) {
      const kuis = daftarKuis.find(k => k.id === kuisId);
      if (!kuis) return;

      kuisAktif = kuis;
      jawabanUser = {};
      currentIndex = 0;

      // Load soal dari Supabase
      try {
        const { data, error } = await supabaseClient
          .from('soal')
          .select('*')
          .eq('kuis_id', kuisId)
          .order('urutan', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          showToast('Kuis ini belum memiliki soal.', 'error');
          return;
        }

        soalList = data;

        // Setup timer
        waktuTersisa = (kuis.durasi || 10) * 60;

        // Pindah ke mode quiz
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.add('active');
        document.getElementById('quiz-title').textContent = kuis.judul;
        document.getElementById('progress-total').textContent = soalList.length;

        // Render soal pertama
        renderSoal();
        renderNavigator();
        startTimer();

        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        console.error('Gagal load soal:', err);
        showToast('Gagal memuat soal: ' + err.message, 'error');
      }
    }

    // ============================================================
    // RENDER SOAL
    // ============================================================
    function renderSoal() {
      const soal = soalList[currentIndex];
      if (!soal) return;

      document.getElementById('q-number').textContent = currentIndex + 1;
      document.getElementById('q-text').textContent = soal.pertanyaan;

      // Options
      const opts = [
        { key: 'A', text: soal.pilihan_a },
        { key: 'B', text: soal.pilihan_b },
        { key: 'C', text: soal.pilihan_c },
        { key: 'D', text: soal.pilihan_d }
      ].filter(o => o.text);

      const selected = jawabanUser[soal.id];

      document.getElementById('q-options').innerHTML = opts.map(o => `
        <label class="option-item ${selected === o.key ? 'selected' : ''}" data-key="${o.key}">
          <input type="radio" name="jawaban" value="${o.key}" ${selected === o.key ? 'checked' : ''}>
          <span class="option-letter">${o.key}</span>
          <span>${o.text}</span>
        </label>
      `).join('');

      // Attach event
      document.querySelectorAll('.option-item').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.dataset.key;
          jawabanUser[soal.id] = key;
          document.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
          el.classList.add('selected');
          renderNavigator();
          updateProgress();
        });
      });

      // Update tombol
      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      const isLast = currentIndex === soalList.length - 1;
      document.getElementById('btn-next').style.display = isLast ? 'none' : 'inline-flex';

      // Update progress
      document.getElementById('progress-current').textContent = currentIndex + 1;
      updateProgress();
    }

    // ============================================================
    // UPDATE PROGRESS
    // ============================================================
    function updateProgress() {
      const total = soalList.length;
      const dijawab = Object.keys(jawabanUser).length;
      const persen = total > 0 ? Math.round((dijawab / total) * 100) : 0;

      document.getElementById('progress-percent').textContent = persen + '%';
      document.getElementById('progress-fill').style.width = persen + '%';
      document.getElementById('quiz-subtitle').textContent = `Soal ${currentIndex + 1} dari ${total}`;
    }

    // ============================================================
    // RENDER NAVIGATOR SOAL
    // ============================================================
    function renderNavigator() {
      const nav = document.getElementById('question-nav');
      nav.innerHTML = soalList.map((s, i) => {
        const answered = jawabanUser[s.id] ? 'answered' : '';
        const current = i === currentIndex ? 'current' : '';
        return `<button class="q-nav-btn ${answered} ${current}" onclick="gotoSoal(${i})">${i + 1}</button>`;
      }).join('');
    }

    function gotoSoal(i) {
      if (i < 0 || i >= soalList.length) return;
      currentIndex = i;
      renderSoal();
      renderNavigator();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // TIMER
    // ============================================================
    function startTimer() {
      updateTimerDisplay();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        waktuTersisa--;
        updateTimerDisplay();

        if (waktuTersisa <= 0) {
          clearInterval(timerInterval);
          showToast('Waktu habis! Jawaban otomatis dikirim.', 'info');
          selesaiKuis();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const menit = Math.floor(waktuTersisa / 60);
      const detik = waktuTersisa % 60;
      const text = `${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
      document.getElementById('timer-text').textContent = text;

      const timerEl = document.getElementById('quiz-timer');
      if (waktuTersisa <= 60) {
        timerEl.classList.add('warning');
      } else {
        timerEl.classList.remove('warning');
      }
    }

    // ============================================================
    // SELESAI KUIS — Hitung Skor & Simpan
    // ============================================================
    async function selesaiKuis() {
      clearInterval(timerInterval);

      // Hitung benar/salah
      let benar = 0;
      soalList.forEach(s => {
        if (jawabanUser[s.id] === s.jawaban_benar) benar++;
      });

      const total = soalList.length;
      const salah = total - benar;
      const nilai = total > 0 ? Math.round((benar / total) * 100) : 0;

      // Simpan ke tabel nilai (khusus siswa)
      if (currentRole === 'siswa' && currentSiswa) {
        try {
          await supabaseClient.from('nilai').insert([{
            nama_siswa: currentSiswa.nama,
            kelas: currentSiswa.kelas,
            materi: kuisAktif.judul,
            nilai: nilai,
            created_at: new Date().toISOString()
          }]);

          // Log aktivitas
          await supabaseClient.from('aktivitas').insert([{
            siswa_id: currentSiswa.id,
            tipe: 'kuis',
            judul: kuisAktif.judul,
            status: 'selesai',
            created_at: new Date().toISOString()
          }]);
        } catch (err) {
          console.error('Gagal simpan nilai:', err);
        }
      }

      // Tampilkan hasil
      tampilkanHasil(benar, salah, total, nilai);
    }

    // ============================================================
    // TAMPILKAN HASIL
    // ============================================================
    function tampilkanHasil(benar, salah, total, nilai) {
      document.getElementById('quiz-view').classList.remove('active');
      document.getElementById('result-view').classList.add('active');

      document.getElementById('result-score').textContent = nilai;
      document.getElementById('result-correct').textContent = benar;
      document.getElementById('result-wrong').textContent = salah;
      document.getElementById('result-total').textContent = total;

      const iconEl = document.getElementById('result-icon');
      const titleEl = document.getElementById('result-title');
      const descEl = document.getElementById('result-desc');

      if (nilai >= 90) {
        iconEl.className = 'result-icon excellent';
        iconEl.innerHTML = '<i class="fas fa-trophy"></i>';
        titleEl.textContent = 'Luar Biasa! 🏆';
        descEl.textContent = 'Pemahamanmu tentang K3 sangat baik. Pertahankan!';
      } else if (nilai >= 75) {
        iconEl.className = 'result-icon good';
        iconEl.innerHTML = '<i class="fas fa-thumbs-up"></i>';
        titleEl.textContent = 'Bagus! 👍';
        descEl.textContent = 'Kamu sudah lulus. Pelajari lagi materi yang masih salah.';
      } else if (nilai >= 60) {
        iconEl.className = 'result-icon average';
        iconEl.innerHTML = '<i class="fas fa-face-meh"></i>';
        titleEl.textContent = 'Cukup Baik';
        descEl.textContent = 'Pelajari kembali materi K3 dan coba lagi untuk hasil lebih baik.';
      } else {
        iconEl.className = 'result-icon poor';
        iconEl.innerHTML = '<i class="fas fa-face-frown"></i>';
        titleEl.textContent = 'Perlu Belajar Lagi';
        descEl.textContent = 'Jangan menyerah! Baca materi K3 dengan seksama dan coba lagi.';
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // KEMBALI KE DAFTAR
    // ============================================================
    function kembaliKeDaftar() {
      clearInterval(timerInterval);
      document.getElementById('result-view').classList.remove('active');
      document.getElementById('quiz-view').classList.remove('active');
      document.getElementById('list-view').classList.remove('hidden');
      kuisAktif = null;
      soalList = [];
      jawabanUser = {};
      currentIndex = 0;
      loadKuis();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // HAPUS KUIS (GURU)
    // ============================================================
    async function hapusKuis(id) {
      if (!confirm('Yakin ingin menghapus kuis ini?')) return;
      try {
        await supabaseClient.from('soal').delete().eq('kuis_id', id);
        const { error } = await supabaseClient.from('kuis').delete().eq('id', id);
        if (error) throw error;
        showToast('Kuis berhasil dihapus!', 'success');
        loadKuis();
      } catch (err) {
        showToast('Gagal menghapus: ' + err.message, 'error');
      }
    }

    // ============================================================
    // EVENT LISTENER
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Halaman Kuis init');

      await cekRole();
      await loadKuis();

      // Tombol back
      document.getElementById('back-btn').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = currentRole === 'guru' ? 'dashboard-guru.html' : 'dashboard-siswa.html';
      });

      // Navigasi soal
      document.getElementById('btn-prev').addEventListener('click', () => gotoSoal(currentIndex - 1));
      document.getElementById('btn-next').addEventListener('click', () => gotoSoal(currentIndex + 1));

      // Selesai
      document.getElementById('btn-finish').addEventListener('click', () => {
        const dijawab = Object.keys(jawabanUser).length;
        const total = soalList.length;

        if (dijawab < total) {
          if (!confirm(`Masih ada ${total - dijawab} soal yang belum dijawab. Yakin ingin selesai?`)) return;
        }

        selesaiKuis();
      });

      // Kembali ke daftar
      document.getElementById('btn-back-list').addEventListener('click', kembaliKeDaftar);
    });

    // Expose
    window.mulaiKuis = mulaiKuis;
    window.gotoSoal = gotoSoal;
    window.hapusKuis = hapusKuis;
  </script>
