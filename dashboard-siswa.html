<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi K3 | Media Pembelajaran</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1e40af;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --danger: #dc2626;
      --success: #16a34a;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 4rem;
    }

    /* NAVBAR */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-200);
      padding: 0.9rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .navbar-left { display: flex; align-items: center; gap: 0.9rem; }

    .back-btn {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--gray-100); color: var(--gray-700);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: var(--transition);
      font-size: 0.95rem;
    }
    .back-btn:hover { background: var(--primary); color: white; transform: translateX(-3px); }

    .navbar-brand {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 800; font-size: 1.05rem; color: var(--primary);
    }

    .navbar-brand .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1rem;
    }

    .navbar-right { display: flex; align-items: center; gap: 0.7rem; }

    .user-chip {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.35rem 0.85rem 0.35rem 0.35rem;
      background: var(--gray-100);
      border-radius: 999px;
    }
    .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; font-weight: 700; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      text-transform: uppercase;
    }
    .user-name { font-size: 0.82rem; font-weight: 700; color: var(--gray-800); }

    /* CONTAINER */
    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    /* HEADER */
    .page-header {
      margin-bottom: 2rem;
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .page-header .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.35rem 0.8rem;
      background: #dbeafe; color: #1e40af;
      border-radius: 999px;
      font-size: 0.72rem; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .page-header h1 {
      font-size: 1.9rem; font-weight: 800;
      color: var(--gray-800);
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .page-header p {
      font-size: 0.92rem; color: var(--gray-500);
      line-height: 1.6; max-width: 640px;
    }

    /* PROGRESS BAR */
    .progress-wrapper {
      background: white;
      border-radius: var(--radius-sm);
      padding: 1.2rem 1.4rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-100);
      margin-bottom: 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }

    .progress-text {
      flex-shrink: 0;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gray-700);
    }

    .progress-track {
      flex: 1;
      height: 10px;
      background: var(--gray-100);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      width: 0%;
    }

    .progress-percent {
      flex-shrink: 0;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      min-width: 45px;
      text-align: right;
    }

    /* MATERI GRID */
    .materi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.2rem;
    }

    .materi-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--gray-100);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      animation: slideUp 0.4s ease-out backwards;
    }

    .materi-card:nth-child(1) { animation-delay: 0.05s; }
    .materi-card:nth-child(2) { animation-delay: 0.10s; }
    .materi-card:nth-child(3) { animation-delay: 0.15s; }
    .materi-card:nth-child(4) { animation-delay: 0.20s; }
    .materi-card:nth-child(5) { animation-delay: 0.25s; }

    .materi-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(30,64,175,0.15);
      border-color: var(--primary-light);
    }

    .materi-card-header {
      padding: 1.5rem 1.4rem 1rem;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      display: flex; align-items: center; justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .materi-card-header::before {
      content: '';
      position: absolute;
      width: 100px; height: 100px;
      background: rgba(59,130,246,0.1);
      border-radius: 50%;
      top: -40px; right: -30px;
    }

    .materi-icon {
      width: 56px; height: 56px;
      background: white;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(30,64,175,0.15);
      position: relative;
      z-index: 1;
    }

    .materi-status {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.7rem;
      background: rgba(255,255,255,0.9);
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      position: relative;
      z-index: 1;
    }

    .materi-status.done {
      background: #dcfce7;
      color: #15803d;
    }

    .materi-card-body {
      padding: 1.2rem 1.4rem 1.4rem;
    }

    .materi-card-body h3 {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gray-800);
      margin-bottom: 0.5rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .materi-card-body p {
      font-size: 0.82rem;
      color: var(--gray-500);
      line-height: 1.55;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .materi-meta {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 0.9rem;
      border-top: 1px solid var(--gray-100);
    }

    .materi-meta-item {
      display: flex; align-items: center; gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--gray-500);
      font-weight: 600;
    }

    .materi-meta-item i { color: var(--primary); }

    /* EMPTY */
    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--gray-500);
    }
    .empty-state i {
      font-size: 3rem;
      color: var(--gray-300);
      margin-bottom: 1rem;
      display: block;
    }
    .empty-state p { font-size: 0.95rem; }

    /* MODAL BACA MATERI */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center; align-items: flex-start;
      padding: 2rem 1rem;
      overflow-y: auto;
    }
    .modal-overlay.show { display: flex; }

    .modal-materi {
      background: white;
      border-radius: var(--radius);
      max-width: 780px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      animation: modalIn 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      overflow: hidden;
      margin: auto;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .modal-header {
      padding: 1.5rem 1.8rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem;
    }

    .modal-header-title { flex: 1; }
    .modal-header-title .label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      opacity: 0.85;
      margin-bottom: 0.3rem;
    }
    .modal-header-title h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .modal-close {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: var(--transition);
    }
    .modal-close:hover { background: rgba(255,255,255,0.35); transform: rotate(90deg); }

    .modal-body {
      padding: 2rem 1.8rem;
      max-height: 65vh;
      overflow-y: auto;
      line-height: 1.75;
    }

    .modal-body h3 {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--gray-800);
      margin: 1.5rem 0 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--gray-100);
    }

    .modal-body h3:first-child { margin-top: 0; }

    .modal-body p {
      font-size: 0.92rem;
      color: var(--gray-700);
      margin-bottom: 0.9rem;
    }

    .modal-body ul, .modal-body ol {
      margin: 0.75rem 0 1rem 1.4rem;
    }

    .modal-body li {
      font-size: 0.9rem;
      color: var(--gray-700);
      margin-bottom: 0.4rem;
      line-height: 1.65;
    }

    .modal-body strong { color: var(--gray-800); font-weight: 700; }

    .modal-body .highlight-box {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-left: 4px solid var(--primary);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      margin: 1rem 0;
    }

    .modal-body .highlight-box p {
      font-size: 0.88rem;
      color: #1e3a8a;
      margin: 0;
    }

    .modal-body .warning-box {
      background: #fef2f2;
      border-left: 4px solid var(--danger);
      padding: 1rem 1.2rem;
      border-radius: 10px;
      margin: 1rem 0;
    }

    .modal-body .warning-box p {
      font-size: 0.88rem;
      color: #991b1b;
      margin: 0;
    }

    .modal-footer {
      padding: 1.2rem 1.8rem;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-100);
      display: flex; justify-content: space-between; align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .nav-buttons { display: flex; gap: 0.6rem; }

    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.3rem;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 4px 12px rgba(30,64,175,0.25);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(30,64,175,0.35);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-success {
      background: linear-gradient(135deg, #15803d, var(--success));
      color: white;
      box-shadow: 0 4px 12px rgba(22,163,74,0.25);
    }
    .btn-success:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(22,163,74,0.35);
    }

    .btn-outline {
      background: white;
      border: 1.5px solid var(--gray-200);
      color: var(--gray-700);
    }
    .btn-outline:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: #eff6ff;
    }

    /* LOADING SKELETON */
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* TOAST */
    .toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: white; padding: 1rem 1.3rem;
      border-radius: 10px; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.88rem; font-weight: 500;
      z-index: 9999;
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); }
    .toast i { font-size: 1.2rem; }
    .toast.error   { border-left: 4px solid var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.success i { color: var(--success); }
    .toast.info    { border-left: 4px solid var(--primary); }
    .toast.info i  { color: var(--primary); }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .navbar { padding: 0.75rem 1rem; }
      .container { padding: 1.5rem 1rem; }
      .page-header h1 { font-size: 1.4rem; }
      .user-name { display: none; }
      .materi-grid { grid-template-columns: 1fr; }
      .modal-header { padding: 1.2rem 1.3rem; }
      .modal-header-title h2 { font-size: 1.1rem; }
      .modal-body { padding: 1.5rem 1.3rem; }
      .modal-footer { padding: 1rem 1.3rem; }
      .toast { right: 0.75rem; left: 0.75rem; max-width: none; }
    }
  </style>
</head>
<body data-page="materi">

  <div id="toast" class="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toast-message">Pesan</span>
  </div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-left">
      <a href="dashboard-siswa.html" class="back-btn">
        <i class="fas fa-arrow-left"></i>
      </a>
      <div class="navbar-brand">
        <div class="brand-icon"><i class="fas fa-book"></i></div>
        <span>Materi K3</span>
      </div>
    </div>

    <div class="navbar-right">
      <div class="user-chip">
        <div class="user-avatar" id="user-avatar">S</div>
        <span class="user-name" id="user-name">Siswa</span>
      </div>
    </div>
  </nav>

  <!-- CONTAINER -->
  <main class="container">

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="badge"><i class="fas fa-book-open"></i> Media Pembelajaran</div>
      <h1>Materi Keselamatan &amp; Kesehatan Kerja</h1>
      <p>Pelajari materi K3 berikut dengan seksama. Setiap materi yang selesai dibaca akan tercatat sebagai progres belajar Anda.</p>
    </div>

    <!-- PROGRESS -->
    <div class="progress-wrapper">
      <div class="progress-text">
        <i class="fas fa-chart-line" style="color:var(--primary);"></i> Progres
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-percent" id="progress-percent">0%</div>
    </div>

    <!-- MATERI GRID -->
    <div class="materi-grid" id="materi-grid">
      <!-- Skeleton Loading -->
      <div class="materi-card">
        <div class="skeleton" style="height:120px;border-radius:0;"></div>
        <div style="padding:1.4rem;">
          <div class="skeleton" style="height:16px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:12px;width:60%;"></div>
        </div>
      </div>
      <div class="materi-card">
        <div class="skeleton" style="height:120px;border-radius:0;"></div>
        <div style="padding:1.4rem;">
          <div class="skeleton" style="height:16px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:12px;width:60%;"></div>
        </div>
      </div>
      <div class="materi-card">
        <div class="skeleton" style="height:120px;border-radius:0;"></div>
        <div style="padding:1.4rem;">
          <div class="skeleton" style="height:16px;margin-bottom:10px;"></div>
          <div class="skeleton" style="height:12px;width:60%;"></div>
        </div>
      </div>
    </div>

  </main>

  <!-- MODAL BACA MATERI -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-materi">
      <div class="modal-header">
        <div class="modal-header-title">
          <div class="label" id="modal-label">Materi</div>
          <h2 id="modal-title">Judul Materi</h2>
        </div>
        <button class="modal-close" onclick="closeModal()" aria-label="Tutup">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="modal-body" id="modal-content">
        <!-- Diisi oleh JS -->
      </div>

      <div class="modal-footer">
        <div class="nav-buttons">
          <button class="btn btn-outline" id="btn-prev" onclick="prevMateri()">
            <i class="fas fa-arrow-left"></i> Sebelumnya
          </button>
          <button class="btn btn-outline" id="btn-next" onclick="nextMateri()">
            Berikutnya <i class="fas fa-arrow-right"></i>
          </button>
        </div>
        <button class="btn btn-success" id="btn-selesai" onclick="tandaiSelesai()">
          <i class="fas fa-check"></i> Tandai Selesai
        </button>
      </div>
    </div>
  </div>

  <!-- SUPABASE & APP.JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>

  <!-- SCRIPT MATERI -->
  <script>
    // ============================================================
    // STATE
    // ============================================================
    let daftarMateri = [];
    let materiSelesai = new Set();
    let currentIndex = -1;
    let currentSiswa = null;

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      if (!toast || !msg) return;
      const icon = toast.querySelector('i');
      toast.className = 'toast ' + type;
      msg.textContent = message;
      const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      if (icon) icon.className = 'fas ' + (icons[type] || icons.info);
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============================================================
    // CEK SESSION SISWA
    // ============================================================
    function cekSession() {
      const sessionStr = localStorage.getItem('siswa_session');
      if (!sessionStr) {
        window.location.href = 'index.html';
        return null;
      }
      try {
        return JSON.parse(sessionStr);
      } catch (e) {
        localStorage.removeItem('siswa_session');
        window.location.href = 'index.html';
        return null;
      }
    }

    // ============================================================
    // LOAD MATERI DARI SUPABASE
    // ============================================================
    async function loadMateri() {
      const grid = document.getElementById('materi-grid');

      try {
        const { data, error } = await supabaseClient
          .from('materi')
          .select('*')
          .eq('status', 'aktif')
          .order('urutan', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <i class="fas fa-inbox"></i>
              <p>Belum ada materi tersedia.</p>
            </div>`;
          return;
        }

        daftarMateri = data;

        // Load materi yang sudah selesai dibaca oleh siswa
        await loadMateriSelesai();

        // Render kartu
        renderMateriCards();
        updateProgress();

      } catch (err) {
        console.error('Gagal load materi:', err);
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-exclamation-triangle"></i>
            <p>Gagal memuat materi.</p>
          </div>`;
      }
    }

    // ============================================================
    // LOAD MATERI YANG SUDAH SELESAI DIBACA
    // ============================================================
    async function loadMateriSelesai() {
      if (!currentSiswa) return;

      try {
        const { data, error } = await supabaseClient
          .from('aktivitas')
          .select('judul')
          .eq('siswa_id', currentSiswa.id)
          .eq('tipe', 'materi')
          .eq('status', 'selesai');

        if (error) throw error;

        materiSelesai = new Set((data || []).map(d => d.judul));
        console.log('✅ Materi selesai:', [...materiSelesai]);

      } catch (err) {
        console.error('Gagal load materi selesai:', err);
        materiSelesai = new Set();
      }
    }

    // ============================================================
    // RENDER KARTU MATERI
    // ============================================================
    function renderMateriCards() {
      const grid = document.getElementById('materi-grid');

      grid.innerHTML = daftarMateri.map((m, i) => {
        const selesai = materiSelesai.has(m.judul);
        const icon = m.icon || 'fa-book';
        const jumlahKata = (m.konten || '').split(/\s+/).length;
        const estimasiBaca = Math.max(1, Math.ceil(jumlahKata / 200));

        return `
          <div class="materi-card" onclick="openMateri(${i})">
            <div class="materi-card-header">
              <div class="materi-icon"><i class="fas ${icon}"></i></div>
              <span class="materi-status ${selesai ? 'done' : ''}">
                ${selesai ? '<i class="fas fa-check-circle"></i> Selesai' : `Materi ${i + 1}`}
              </span>
            </div>
            <div class="materi-card-body">
              <h3>${m.judul}</h3>
              <p>${m.deskripsi || 'Klik untuk membaca materi ini.'}</p>
              <div class="materi-meta">
                <div class="materi-meta-item">
                  <i class="fas fa-clock"></i> ${estimasiBaca} menit baca
                </div>
                <div class="materi-meta-item">
                  <i class="fas fa-arrow-right"></i> Baca
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // UPDATE PROGRESS BAR
    // ============================================================
    function updateProgress() {
      const total = daftarMateri.length;
      const selesai = materiSelesai.size;
      const persen = total > 0 ? Math.round((selesai / total) * 100) : 0;

      const fill = document.getElementById('progress-fill');
      const percent = document.getElementById('progress-percent');

      if (fill) fill.style.width = persen + '%';
      if (percent) percent.textContent = persen + '%';
    }

    // ============================================================
    // BUKA MATERI (MODAL)
    // ============================================================
    function openMateri(index) {
      if (index < 0 || index >= daftarMateri.length) return;

      currentIndex = index;
      const m = daftarMateri[index];
      const selesai = materiSelesai.has(m.judul);

      // Update header modal
      document.getElementById('modal-label').textContent = `Materi ${index + 1} dari ${daftarMateri.length}`;
      document.getElementById('modal-title').textContent = m.judul;

      // Update konten
      const konten = m.konten || '<p>Konten materi belum tersedia.</p>';
      document.getElementById('modal-content').innerHTML = konten;

      // Update tombol selesai
      const btnSelesai = document.getElementById('btn-selesai');
      if (selesai) {
        btnSelesai.innerHTML = '<i class="fas fa-check-circle"></i> Sudah Selesai';
        btnSelesai.disabled = true;
        btnSelesai.classList.remove('btn-success');
        btnSelesai.classList.add('btn-outline');
      } else {
        btnSelesai.innerHTML = '<i class="fas fa-check"></i> Tandai Selesai';
        btnSelesai.disabled = false;
        btnSelesai.classList.add('btn-success');
        btnSelesai.classList.remove('btn-outline');
      }

      // Update tombol navigasi
      document.getElementById('btn-prev').disabled = (index === 0);
      document.getElementById('btn-next').disabled = (index === daftarMateri.length - 1);

      // Tampilkan modal
      document.getElementById('modal-overlay').classList.add('show');
      document.body.style.overflow = 'hidden';

      // Scroll modal ke atas
      setTimeout(() => {
        document.getElementById('modal-content').scrollTop = 0;
      }, 100);
    }

    // ============================================================
    // TUTUP MODAL
    // ============================================================
    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('show');
      document.body.style.overflow = '';
      currentIndex = -1;
    }

    // ============================================================
    // NAVIGASI MATERI
    // ============================================================
    function prevMateri() {
      if (currentIndex > 0) openMateri(currentIndex - 1);
    }

    function nextMateri() {
      if (currentIndex < daftarMateri.length - 1) openMateri(currentIndex + 1);
    }

    // ============================================================
    // TANDAI SELESAI
    // ============================================================
    async function tandaiSelesai() {
      if (currentIndex < 0 || !currentSiswa) return;

      const m = daftarMateri[currentIndex];
      const btn = document.getElementById('btn-selesai');

      if (materiSelesai.has(m.judul)) {
        showToast('Materi ini sudah ditandai selesai.', 'info');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

      try {
        const { error } = await supabaseClient
          .from('aktivitas')
          .insert([{
            siswa_id: currentSiswa.id,
            tipe: 'materi',
            judul: m.judul,
            status: 'selesai',
            created_at: new Date().toISOString()
          }]);

        if (error) throw error;

        materiSelesai.add(m.judul);
        updateProgress();
        renderMateriCards();

        btn.innerHTML = '<i class="fas fa-check-circle"></i> Sudah Selesai';
        btn.disabled = true;
        btn.classList.remove('btn-success');
        btn.classList.add('btn-outline');

        showToast('Materi berhasil ditandai selesai! 🎉', 'success');

      } catch (err) {
        console.error('Gagal menyimpan:', err);
        showToast('Gagal menyimpan: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-check"></i> Tandai Selesai';
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Halaman Materi init');

      // Cek session
      currentSiswa = cekSession();
      if (!currentSiswa) return;

      // Isi user info
      const initial = (currentSiswa.nama || 'S').charAt(0).toUpperCase();
      document.getElementById('user-avatar').textContent = initial;
      document.getElementById('user-name').textContent = currentSiswa.nama || 'Siswa';

      // Load materi
      await loadMateri();

      // Event: klik overlay untuk close
      document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'modal-overlay') closeModal();
      });

      // Event: ESC untuk close
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    });

    // Expose ke global
    window.openMateri = openMateri;
    window.closeModal = closeModal;
    window.prevMateri = prevMateri;
    window.nextMateri = nextMateri;
    window.tandaiSelesai = tandaiSelesai;
  </script>

</body>
</html>
