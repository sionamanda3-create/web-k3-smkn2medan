<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru | Media Pembelajaran K3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #7c3aed; --primary-light: #a855f7;
      --accent: #f59e0b; --danger: #dc2626; --success: #16a34a;
      --orange: #ea580c; --orange-light: #f59e0b;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-300: #d1d5db; --gray-400: #9ca3af; --gray-500: #6b7280;
      --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
      --radius: 16px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-200); padding: 0.9rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .navbar-brand { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; font-size: 1.05rem; color: var(--primary); text-decoration: none; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1rem;
      box-shadow: 0 4px 10px rgba(124,58,237,0.3);
    }
    .role-badge { background: #e9d5ff; color: #6b21a8; font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px; text-transform: uppercase; }
    .navbar-right { display: flex; align-items: center; gap: 0.9rem; }
    .user-chip { display: flex; align-items: center; gap: 0.65rem; padding: 0.4rem 0.9rem 0.4rem 0.4rem; background: var(--gray-100); border-radius: 999px; }
    .user-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; text-transform: uppercase;
    }
    .user-details { display: flex; flex-direction: column; line-height: 1.2; }
    .user-details .user-name { font-size: 0.85rem; font-weight: 700; color: var(--gray-800); }
    .user-details .user-role { font-size: 0.7rem; color: var(--gray-500); font-weight: 500; }
    .btn-icon {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1.5px solid var(--gray-200); background: var(--white);
      color: var(--gray-600); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.3s; font-size: 0.95rem;
    }
    .btn-icon:hover { background: var(--danger); border-color: var(--danger); color: white; }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

    .welcome-hero {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: var(--radius); padding: 2.2rem 2rem; color: white;
      margin-bottom: 1.5rem; position: relative; overflow: hidden;
      box-shadow: 0 12px 30px rgba(124,58,237,0.25);
    }
    .welcome-hero::before, .welcome-hero::after {
      content: ''; position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1);
    }
    .welcome-hero::before { width: 220px; height: 220px; top: -80px; right: -60px; }
    .welcome-hero::after { width: 150px; height: 150px; bottom: -60px; right: 120px; background: rgba(255,255,255,0.06); }
    .welcome-content { position: relative; z-index: 1; }
    .welcome-greeting { font-size: 0.85rem; font-weight: 500; opacity: 0.9; margin-bottom: 0.35rem; }
    .welcome-hero h1 { font-size: 1.75rem; font-weight: 800; line-height: 1.25; margin-bottom: 0.5rem; }
    .welcome-hero h1 .highlight { color: #fde68a; }
    .welcome-hero p { font-size: 0.9rem; opacity: 0.92; max-width: 600px; line-height: 1.6; }
    .welcome-meta { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.3rem; }
    .meta-badge {
      display: inline-flex; align-items: center; gap: 0.45rem;
      background: rgba(255,255,255,0.18); backdrop-filter: blur(8px);
      padding: 0.45rem 0.9rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--white); border-radius: 12px; padding: 1.3rem;
      box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
      display: flex; align-items: center; gap: 1rem; transition: all 0.3s;
    }
    .stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: var(--primary-light); }
    .stat-icon { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .stat-icon.blue { background: #dbeafe; color: #1e40af; }
    .stat-icon.green { background: #dcfce7; color: #16a34a; }
    .stat-icon.orange { background: #fed7aa; color: #ea580c; }
    .stat-icon.purple { background: #e9d5ff; color: #7c3aed; }
    .stat-label { font-size: 0.78rem; color: var(--gray-500); font-weight: 500; margin-bottom: 0.15rem; }
    .stat-value { font-size: 1.5rem; font-weight: 800; color: var(--gray-800); line-height: 1.1; }

    .section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1rem; margin-top: 2rem; gap: 0.75rem; flex-wrap: wrap;
    }
    .section-header h2 { font-size: 1.15rem; font-weight: 700; color: var(--gray-800); display: flex; align-items: center; gap: 0.5rem; }
    .section-header h2 i { color: var(--primary); font-size: 1rem; }
    .card { background: var(--white); border-radius: 12px; border: 1px solid var(--gray-100); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: 1.5rem; }

    .btn { padding: 0.75rem 1.3rem; border-radius: 10px; border: none; font-family: inherit; font-size: 0.88rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; transition: all 0.3s; text-decoration: none; }
    .btn-ghost { background: var(--gray-100); color: var(--gray-700); }
    .btn-ghost:hover { background: var(--gray-200); }
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: white; }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-download { background: linear-gradient(135deg, #0284c7, #0ea5e9); color: white; }
    .btn-download:hover { transform: translateY(-2px); }
    .btn-hapus { background: #fee2e2; color: #b91c1c; }
    .btn-hapus:hover { background: #fecaca; }

    .jawaban-item {
      padding: 1.4rem 1.6rem;
      border-bottom: 1px solid var(--gray-100);
      transition: all 0.3s;
    }
    .jawaban-item:hover { background: #faf5ff; }
    .jawaban-item:last-child { border-bottom: none; }

    .jawaban-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap;
    }
    .jawaban-siswa { display: flex; align-items: center; gap: 0.9rem; }
    .jawaban-avatar {
      width: 45px; height: 45px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem; flex-shrink: 0;
    }
    .jawaban-header h4 { font-size: 0.95rem; font-weight: 800; color: var(--gray-800); margin-bottom: 0.25rem; }
    .jawaban-header p { font-size: 0.78rem; color: var(--gray-500); display: flex; gap: 0.9rem; flex-wrap: wrap; }
    .jawaban-header p i { color: var(--primary); font-size: 0.72rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      padding: 0.35rem 0.8rem; border-radius: 999px;
      font-size: 0.72rem; font-weight: 800; text-transform: uppercase;
    }
    .badge.success { background: #dcfce7; color: #15803d; }
    .badge.warning { background: #fef3c7; color: #92400e; }

    /* FILE PREVIEW */
    .file-box {
      background: var(--gray-50); padding: 1.1rem 1.3rem;
      border-radius: 10px; border-left: 4px solid var(--primary);
      margin-bottom: 1rem;
    }
    .file-box-header {
      display: flex; align-items: center; gap: 0.9rem;
      margin-bottom: 0.8rem; flex-wrap: wrap;
    }
    .file-icon-big {
      width: 52px; height: 52px; border-radius: 12px;
      background: white; border: 1.5px solid var(--gray-200);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--primary); flex-shrink: 0;
    }
    .file-meta { flex: 1; min-width: 0; }
    .file-meta h5 { font-size: 0.9rem; font-weight: 800; color: var(--gray-800); margin-bottom: 0.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-meta p { font-size: 0.75rem; color: var(--gray-500); }
    .file-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .preview-img {
      max-width: 100%; max-height: 400px;
      border-radius: 8px; margin-top: 0.7rem;
      cursor: zoom-in; display: block; margin-left: auto; margin-right: auto;
      box-shadow: var(--shadow-md);
    }
    .catatan-box {
      background: #fff7ed; padding: 0.9rem 1.1rem;
      border-radius: 8px; border-left: 3px solid var(--orange);
      font-size: 0.85rem; color: #9a3412;
      margin-bottom: 1rem; line-height: 1.6;
    }

    .nilai-form {
      background: linear-gradient(135deg, #fff7ed, #ffedd5);
      border: 1.5px solid #fed7aa; border-radius: 10px; padding: 1rem 1.2rem;
    }
    .nilai-form h5 { font-size: 0.82rem; font-weight: 800; color: #ea580c; margin-bottom: 0.7rem; display: flex; align-items: center; gap: 0.4rem; }
    .nilai-form-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 0.7rem; align-items: center; }
    .nilai-form-row input {
      padding: 0.7rem 1rem; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-family: inherit; font-size: 0.85rem; outline: none;
      background: white;
    }
    .nilai-form-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,58,237,0.1); }
    .btn-nilai {
      background: linear-gradient(135deg, #ea580c, #f59e0b);
      color: white; border: none; padding: 0.7rem 1.2rem;
      border-radius: 8px; font-family: inherit; font-weight: 700;
      font-size: 0.82rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 0.4rem;
      transition: all 0.3s;
    }
    .btn-nilai:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(234,88,12,0.3); }
    .btn-nilai:disabled { opacity: 0.6; cursor: not-allowed; }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--gray-500); }
    .empty-state i { font-size: 2.5rem; color: var(--gray-300); display: block; margin-bottom: 0.75rem; }
    .empty-state p { font-size: 0.88rem; }

    .toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: white; padding: 1rem 1.3rem;
      border-radius: 10px; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.88rem; font-weight: 500; z-index: 9999;
      transform: translateX(400px); transition: transform 0.4s;
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.success i { color: var(--success); }
    .toast.info { border-left: 4px solid var(--primary); }
    .toast.info i { color: var(--primary); }

    /* MODAL ZOOM */
    .zoom-modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); z-index: 9999;
      justify-content: center; align-items: center;
      padding: 2rem; cursor: zoom-out;
    }
    .zoom-modal.show { display: flex; }
    .zoom-modal img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    @media (max-width: 640px) {
      .navbar { padding: 0.75rem 1rem; }
      .container { padding: 1.5rem 1rem 4rem; }
      .welcome-hero h1 { font-size: 1.35rem; }
      .user-details { display: none; }
      .nilai-form-row { grid-template-columns: 1fr; }
      .toast { right: 0.75rem; left: 0.75rem; max-width: none; }
    }
  </style>
</head>
<body>

<div id="toast" class="toast">
  <i class="fas fa-info-circle"></i>
  <span id="toast-message">Pesan</span>
</div>

<nav class="navbar">
  <div class="navbar-left" style="display:flex;align-items:center;gap:0.8rem;">
    <a href="dashboard-guru.html" class="navbar-brand">
      <div class="brand-icon"><i class="fas fa-chalkboard-user"></i></div>
      <span>Media K3</span>

    <span class="role-badge">Guru</span>

      <i class="fas fa-right-from-bracket"></i>

  </div>
</nav>

<main class="container">

  <section class="welcome-hero">
    <div class="welcome-content">
      <p class="welcome-greeting">Selamat datang kembali,</p>
      <h1>Halo, <span class="highlight" id="welcome-name">Guru</span>! 👋</h1>
      <p>Pantau file tugas yang dikirim siswa, unduh, dan beri nilai melalui dashboard ini.</p>
      <div class="welcome-meta">
        <div class="meta-badge"><i class="fas fa-calendar-day"></i><span id="current-date">-</span></div>
        <div class="meta-badge"><i class="fas fa-clock"></i><span id="current-time">-</span></div>
        <div class="meta-badge"><i class="fas fa-user-tie"></i><span>Pengajar K3</span></div>
      </div>
    </div>
  </section>

  <section class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon blue"><i class="fas fa-inbox"></i></div>
      <div>
        <p class="stat-label">Total Tugas Masuk</p>
        <p class="stat-value" id="stat-total">0</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon orange"><i class="fas fa-clock"></i></div>
      <div>
        <p class="stat-label">Menunggu Dinilai</p>
        <p class="stat-value" id="stat-menunggu">0</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><i class="fas fa-check-circle"></i></div>
      <div>
        <p class="stat-label">Sudah Dinilai</p>
        <p class="stat-value" id="stat-dinilai">0</p>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon purple"><i class="fas fa-users"></i></div>
      <div>
        <p class="stat-label">Total Siswa</p>
        <p class="stat-value" id="stat-siswa">0</p>
      </div>
    </div>
  </section>

  <div class="section-header">
    <h2><i class="fas fa-inbox"></i> Tugas yang Dikirim Siswa</h2>
    <button class="btn btn-ghost" onclick="loadJawaban()" style="padding:0.5rem 1rem;font-size:0.82rem;">
      <i class="fas fa-rotate"></i> Muat Ulang
    </button>
  </div>

  <div class="card">
    <div id="jawaban-list">
      <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Memuat tugas siswa...</p></div>
    </div>
  </div>

</main>

<!-- MODAL ZOOM -->
<div class="zoom-modal" id="zoomModal" onclick="closeZoom()">
  <img id="zoomImg" src="" alt="Preview">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://ddnhwcxfktcsyngupdex.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ogAtXLGklIivo88I41J8ZA_9CWzS8D3';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentGuru = null;
  let semuaJawaban = [];

  function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    const msg = document.getElementById('toast-message');
    const icon = toast.querySelector('i');
    toast.className = 'toast ' + type;
    msg.textContent = message;
    const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
    icon.className = 'fas ' + (icons[type] || icons.info);
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatSize(bytes) {
    if (!bytes) return '-';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(2) + ' MB';
  }

  function getFileIcon(filename) {
    const ext = (filename || '').split('.').pop().toLowerCase();
    const map = {
      jpg:'fa-file-image', jpeg:'fa-file-image', png:'fa-file-image',
      gif:'fa-file-image', webp:'fa-file-image',
      pdf:'fa-file-pdf', doc:'fa-file-word', docx:'fa-file-word',
      xls:'fa-file-excel', xlsx:'fa-file-excel',
      ppt:'fa-file-powerpoint', pptx:'fa-file-powerpoint',
      txt:'fa-file-lines', zip:'fa-file-zipper', rar:'fa-file-zipper'
    };
    return map[ext] || 'fa-file';
  }

  function isImage(filename) {
    const ext = (filename || '').split('.').pop().toLowerCase();
    return ['jpg','jpeg','png','gif','webp'].includes(ext);
  }

  function cekSession() {
    const s = localStorage.getItem('guru_session');
    if (!s) { window.location.href = 'index.html'; return null; }
    try { return JSON.parse(s); }
    catch (e) { localStorage.removeItem('guru_session'); window.location.href = 'index.html'; return null; }
  }

  // ===== LOAD JAWABAN =====
  async function loadJawaban() {
    const container = document.getElementById('jawaban-list');
    if (!container) return;
    container.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Memuat tugas siswa...</p></div>';

    try {
      const { data, error } = await supabaseClient
        .from('jawaban_siswa')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) throw error;

      semuaJawaban = data || [];
      updateStatistik();
      renderJawaban();

    } catch (err) {
      console.error('Load jawaban error:', err);
      container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Gagal memuat: ${escapeHtml(err.message)}</p></div>`;
    }
  }

  function updateStatistik() {
    const total = semuaJawaban.length;
    const menunggu = semuaJawaban.filter(j => j.status === 'menunggu').length;
    const dinilai = semuaJawaban.filter(j => j.status === 'dinilai').length;
    const uniqueSiswa = new Set(semuaJawaban.map(j => j.nama_siswa)).size;

    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-menunggu').textContent = menunggu;
    document.getElementById('stat-dinilai').textContent = dinilai;
    document.getElementById('stat-siswa').textContent = uniqueSiswa;
  }

  // ===== RENDER =====
  function renderJawaban() {
    const container = document.getElementById('jawaban-list');

    if (semuaJawaban.length === 0) {
      container.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Belum ada tugas yang dikirim siswa.</p></div>';
      return;
    }

    container.innerHTML = semuaJawaban.map(j => {
      const waktu = new Date(j.created_at).toLocaleString('id-ID', {
        day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
      const isDinilai = j.status === 'dinilai';
      const initial = (j.nama_siswa || '?').charAt(0).toUpperCase();
      const badge = isDinilai
        ? `<span class="badge success">✅ Dinilai: ${j.nilai || 0}</span>`
        : `<span class="badge warning">⏳ Menunggu</span>`;

      // File preview
      let fileBoxHTML = '';
      if (j.file_url) {
        const isImg = isImage(j.file_name);
        const previewHTML = isImg
          ? `<img src="${escapeHtml(j.file_url)}" class="preview-img" alt="${escapeHtml(j.file_name)}" onclick="openZoom('${escapeHtml(j.file_url)}')">`
          : (j.file_type === 'pdf'
            ? `<iframe src="${escapeHtml(j.file_url)}" style="width:100%;height:400px;border-radius:8px;margin-top:0.7rem;border:1px solid var(--gray-200);"></iframe>`
            : '');

        fileBoxHTML = `
          <div class="file-box">
            <div class="file-box-header">
              <div class="file-icon-big"><i class="fas ${getFileIcon(j.file_name)}"></i></div>
              <div class="file-meta">
                <h5>${escapeHtml(j.file_name || 'File Tugas')}</h5>
                <p>Ukuran: ${formatSize(j.file_size)} • Format: ${escapeHtml(j.file_type || '-').toUpperCase()}</p>
              </div>
              <div class="file-actions">
                <a href="${escapeHtml(j.file_url)}" target="_blank" download class="btn btn-download" style="padding:0.5rem 1rem;font-size:0.78rem;">
                  <i class="fas fa-download"></i> Download
                </a>
                <a href="${escapeHtml(j.file_url)}" target="_blank" class="btn btn-primary" style="padding:0.5rem 1rem;font-size:0.78rem;">
                  <i class="fas fa-external-link-alt"></i> Buka
                </a>
              </div>
            </div>
            ${previewHTML}
          </div>`;
      } else {
        fileBoxHTML = '<div class="file-box" style="border-left-color:#dc2626;"><p style="color:#dc2626;font-size:0.85rem;"><i class="fas fa-exclamation-triangle"></i> Siswa tidak melampirkan file.</p></div>';
      }

      const catatanHTML = j.catatan
        ? `<div class="catatan-box"><b><i class="fas fa-comment"></i> Catatan Siswa:</b><br>${escapeHtml(j.catatan)}</div>`
        : '';

      return `
        <div class="jawaban-item">
          <div class="jawaban-header">
            <div class="jawaban-siswa">
              <div class="jawaban-avatar">${initial}</div>
              <div>
                <h4>${escapeHtml(j.nama_siswa)} — ${escapeHtml(j.judul_tugas)}</h4>
                <p>
                  <span><i class="fas fa-school"></i> ${escapeHtml(j.kelas)}</span>
                  <span><i class="fas fa-tag"></i> ${escapeHtml(j.tipe)}</span>
                  <span><i class="fas fa-clock"></i> ${waktu}</span>
                </p>
              </div>
            </div>
            ${badge}
          </div>

          ${catatanHTML}
          ${fileBoxHTML}

          <div class="nilai-form" style="margin-top:1rem;">
            <h5><i class="fas fa-star"></i> Beri Nilai</h5>
            <div class="nilai-form-row">
              <input type="number" id="nilai-${j.id}" min="0" max="100" placeholder="Nilai (0-100)" value="${j.nilai || ''}">
              <input type="text" id="komentar-${j.id}" placeholder="Komentar untuk siswa" value="${escapeHtml(j.komentar_guru || '')}">
              <button class="btn-nilai" onclick="simpanNilai('${j.id}')">
                <i class="fas fa-save"></i> ${isDinilai ? 'Update' : 'Simpan'}
              </button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  // ===== SIMPAN NILAI =====
  async function simpanNilai(id) {
    const nilaiEl = document.getElementById('nilai-' + id);
    const komentarEl = document.getElementById('komentar-' + id);
    const nilai = nilaiEl.value;
    const komentar = komentarEl.value;

    if (!nilai) { showToast('Nilai wajib diisi', 'error'); return; }
    if (nilai < 0 || nilai > 100) { showToast('Nilai harus 0-100', 'error'); return; }

    try {
      const { error } = await supabaseClient
        .from('jawaban_siswa')
        .update({
          nilai: parseInt(nilai),
          komentar_guru: komentar,
          status: 'dinilai'
        })
        .eq('id', id);

      if (error) throw error;

      showToast('Nilai berhasil disimpan! ✅', 'success');
      loadJawaban();
    } catch (err) {
      showToast('Gagal simpan: ' + err.message, 'error');
    }
  }

  // ===== ZOOM =====
  function openZoom(url) {
    document.getElementById('zoomImg').src = url;
    document.getElementById('zoomModal').classList.add('show');
  }
  function closeZoom() {
    document.getElementById('zoomModal').classList.remove('show');
  }

  function logout() {
    if (!confirm('Yakin ingin keluar?')) return;
    localStorage.removeItem('guru_session');
    window.location.href = 'index.html';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    currentGuru = cekSession();
    if (!currentGuru) return;

    const initial = (currentGuru.nama || 'G').charAt(0).toUpperCase();
    document.getElementById('user-avatar').textContent = initial;
    document.getElementById('user-name').textContent = currentGuru.nama || 'Guru';
    document.getElementById('user-email').textContent = currentGuru.email || '-';
    document.getElementById('welcome-name').textContent = (currentGuru.nama || 'Guru').split(' ')[0];

    const now = new Date();
    document.getElementById('current-date').textContent = now.toLocaleDateString('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    document.getElementById('current-time').textContent = now.toLocaleTimeString('id-ID', {
      hour: '2-digit', minute: '2-digit'
    });

    document.getElementById('logout-btn').addEventListener('click', logout);

    await loadJawaban();
  });

  window.loadJawaban = loadJawaban;
  window.simpanNilai = simpanNilai;
  window.openZoom = openZoom;
  window.closeZoom = closeZoom;
  window.logout = logout;
</script>

</body>
</html>
