  <!-- ============================================================
       SCRIPT HALAMAN NILAI
       ============================================================ -->
  <script>
    // ============================================================
    // STATE
    // ============================================================
    let currentRole = 'siswa';
    let currentSiswa = null;
    let semuaNilai = [];
    let semuaSiswa = [];
    let filterKata = '';
    let filterKelas = '';

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      if (!toast || !msg) { alert(message); return; }
      const icon = toast.querySelector('i');
      toast.className = 'toast ' + type;
      msg.textContent = message;
      const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      if (icon) icon.className = 'fas ' + (icons[type] || icons.info);
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============================================================
    // CEK ROLE (SISWA / GURU)
    // ============================================================
    async function cekRole() {
      // Cek session siswa dulu
      const sessionSiswa = localStorage.getItem('siswa_session');
      if (sessionSiswa) {
        try {
          currentSiswa = JSON.parse(sessionSiswa);
          currentRole = 'siswa';
          document.getElementById('user-role').textContent = currentSiswa.nama || 'Siswa';
          document.getElementById('back-btn').href = 'dashboard-siswa.html';
          document.getElementById('page-subtitle').textContent = `Nilai ${currentSiswa.nama} — ${currentSiswa.kelas}`;
          return;
        } catch (e) { /* lanjut */ }
      }

      // Cek session guru
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const { data: profile } = await supabaseClient
          .from('profiles').select('*').eq('id', user.id).single();

        if (profile?.role === 'guru') {
          currentRole = 'guru';
          document.getElementById('user-role').textContent = profile.full_name || 'Guru';
          document.getElementById('back-btn').href = 'dashboard-guru.html';
          document.getElementById('page-subtitle').textContent = 'Rekap nilai semua siswa';
          document.getElementById('btn-export-nilai').style.display = 'inline-flex';
          return;
        }
      }

      window.location.href = 'index.html';
    }

    // ============================================================
    // HITUNG PREDIKAT DARI NILAI
    // ============================================================
    function getPredikat(nilai) {
      if (nilai === null || nilai === undefined || isNaN(nilai)) {
        return { label: '—', class: 'empty' };
      }
      if (nilai >= 90) return { label: 'A', class: 'a' };
      if (nilai >= 80) return { label: 'B', class: 'b' };
      if (nilai >= 70) return { label: 'C', class: 'c' };
      return { label: 'D', class: 'd' };
    }

    function getScoreClass(nilai) {
      if (nilai === null || nilai === undefined || isNaN(nilai)) return 'empty';
      if (nilai >= 90) return 'excellent';
      if (nilai >= 80) return 'good';
      if (nilai >= 70) return 'average';
      return 'poor';
    }

    function getBarClass(nilai) {
      if (nilai >= 90) return 'excellent';
      if (nilai >= 80) return 'good';
      if (nilai >= 70) return 'average';
      return 'poor';
    }

    // ============================================================
    // LOAD DATA (SISWA)
    // ============================================================
    async function loadDataSiswa() {
      if (!currentSiswa) return;

      try {
        // Load nilai kuis siswa
        const { data: nilaiKuis, error: errKuis } = await supabaseClient
          .from('nilai')
          .select('*')
          .eq('nama_siswa', currentSiswa.nama)
          .eq('kelas', currentSiswa.kelas);

        if (errKuis) throw errKuis;

        // Load jawaban latihan siswa
        const { data: jawabanLatihan, error: errLatihan } = await supabaseClient
          .from('jawaban_latihan')
          .select('*')
          .eq('nama_siswa', currentSiswa.nama)
          .eq('kelas', currentSiswa.kelas);

        if (errLatihan) console.warn('Jawaban latihan error:', errLatihan);

        // Kelompokkan nilai per kuis
        const nilaiMap = {};    // { judulKuis: nilai }
        (nilaiKuis || []).forEach(n => {
          if (!nilaiMap[n.materi]) {
            nilaiMap[n.materi] = [];
          }
          nilaiMap[n.materi].push(n.nilai || 0);
        });

        // Rata-rata tiap kuis
        const nilaiKuisAvg = Object.entries(nilaiMap).map(([judul, arr]) => ({
          judul,
          nilai: arr.reduce((a, b) => a + b, 0) / arr.length
        }));

        // Rata-rata nilai kuis
        const rataKuis = nilaiKuisAvg.length > 0
          ? nilaiKuisAvg.reduce((a, b) => a + b.nilai, 0) / nilaiKuisAvg.length
          : null;

        // Rata-rata nilai latihan (dari jumlah soal yang dijawab)
        const rataLatihan = jawabanLatihan && jawabanLatihan.length > 0
          ? Math.round((jawabanLatihan.filter(j => j.jawaban && j.jawaban.trim() !== '').length / jawabanLatihan.length) * 100)
          : null;

        // Nilai akhir = rata-rata kuis & latihan
        let nilaiAkhir = null;
        if (rataKuis !== null && rataLatihan !== null) {
          nilaiAkhir = Math.round((rataKuis + rataLatihan) / 2);
        } else if (rataKuis !== null) {
          nilaiAkhir = Math.round(rataKuis);
        } else if (rataLatihan !== null) {
          nilaiAkhir = rataLatihan;
        }

        // Update statistik
        document.getElementById('stat-latihan').textContent = rataLatihan !== null ? rataLatihan : '—';
        document.getElementById('stat-kuis').textContent = rataKuis !== null ? Math.round(rataKuis) : '—';
        document.getElementById('stat-akhir').textContent = nilaiAkhir !== null ? nilaiAkhir : '—';

        const pred = getPredikat(nilaiAkhir);
        const predEl = document.getElementById('stat-predikat');
        predEl.textContent = pred.label;
        predEl.style.color =
          pred.class === 'a' ? 'var(--success)' :
          pred.class === 'b' ? 'var(--primary)' :
          pred.class === 'c' ? 'var(--accent)' :
          pred.class === 'd' ? 'var(--danger)' : 'var(--gray-500)';

        // Render chart
        renderChart(nilaiKuisAvg);

        // Render tabel detail
        renderTabelSiswa(nilaiKuisAvg, rataLatihan);

      } catch (err) {
        console.error('Gagal load data siswa:', err);
        showToast('Gagal memuat nilai: ' + err.message, 'error');
      }
    }

    // ============================================================
    // RENDER CHART
    // ============================================================
    function renderChart(nilaiKuisAvg) {
      const chart = document.getElementById('chart-bars');
      if (!chart) return;

      if (!nilaiKuisAvg || nilaiKuisAvg.length === 0) {
        chart.innerHTML = `
          <div style="width:100%;text-align:center;color:var(--gray-500);padding:2rem 1rem;">
            <i class="fas fa-chart-simple" style="font-size:2rem;color:var(--gray-300);display:block;margin-bottom:0.5rem;"></i>
            <p style="font-size:0.85rem;">Belum ada data nilai kuis.</p>
          </div>`;
        return;
      }

      const maxHeight = 140;
      chart.innerHTML = nilaiKuisAvg.map(item => {
        const tinggi = Math.max(8, (item.nilai / 100) * maxHeight);
        const cls = getBarClass(item.nilai);
        const judulPendek = item.judul.length > 12 ? item.judul.substring(0, 10) + '…' : item.judul;

        return `
          <div class="chart-bar-item">
            <div class="chart-bar-value">${Math.round(item.nilai)}</div>
            <div class="chart-bar ${cls}" style="height:${tinggi}px;"></div>
            <div class="chart-bar-label" title="${item.judul}">${judulPendek}</div>
          </div>
        `;
      }).join('');
    }

    // ============================================================
    // RENDER TABEL SISWA
    // ============================================================
    function renderTabelSiswa(nilaiKuisAvg, rataLatihan) {
      const tbody = document.querySelector('#tabel-nilai-siswa tbody');
      if (!tbody) return;

      if ((!nilaiKuisAvg || nilaiKuisAvg.length === 0) && rataLatihan === null) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5">
              <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>Belum Ada Nilai</h3>
                <p>Kerjakan kuis dan latihan untuk melihat nilai di sini.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      // Gabungkan semua jenis nilai per judul
      const rows = [];

      nilaiKuisAvg.forEach(item => {
        const pred = getPredikat(item.nilai);
        rows.push({
          judul: item.judul,
          latihan: '—',
          kuis: Math.round(item.nilai),
          akhir: Math.round(item.nilai),
          pred
        });
      });

      // Tambahkan baris latihan umum
      if (rataLatihan !== null) {
        const pred = getPredikat(rataLatihan);
        rows.push({
          judul: 'Latihan Soal',
          latihan: rataLatihan,
          kuis: '—',
          akhir: rataLatihan,
          pred
        });
      }

      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong>${r.judul}</strong></td>
          <td>
            ${r.latihan === '—'
              ? '<span class="score-badge empty">—</span>'
              : `<span class="score-badge ${getScoreClass(r.latihan)}">${r.latihan}</span>`}
          </td>
          <td>
            ${r.kuis === '—'
              ? '<span class="score-badge empty">—</span>'
              : `<span class="score-badge ${getScoreClass(r.kuis)}">${r.kuis}</span>`}
          </td>
          <td>
            <span class="score-badge ${getScoreClass(r.akhir)}">${r.akhir}</span>
            <div class="score-bar">
              <div class="score-bar-fill" style="width:${r.akhir}%;background:${r.akhir >= 90 ? '#16a34a' : r.akhir >= 80 ? '#3b82f6' : r.akhir >= 70 ? '#f59e0b' : '#dc2626'};"></div>
            </div>
          </td>
          <td><span class="predikat ${r.pred.class}">${r.pred.label}</span></td>
        </tr>
      `).join('');
    }

    // ============================================================
    // LOAD DATA (GURU)
    // ============================================================
    async function loadDataGuru() {
      try {
        // Load semua siswa
        const { data: listSiswa, error: errSiswa } = await supabaseClient
          .from('siswa')
          .select('*')
          .order('kelas')
          .order('nama');

        if (errSiswa) throw errSiswa;
        semuaSiswa = listSiswa || [];

        // Load semua nilai kuis
        const { data: listNilai } = await supabaseClient
          .from('nilai')
          .select('*');

        // Load semua jawaban latihan
        const { data: listJawaban } = await supabaseClient
          .from('jawaban_latihan')
          .select('*');

        // Kelompokkan nilai per siswa
        const nilaiPerSiswa = {};

        (listNilai || []).forEach(n => {
          const key = `${n.nama_siswa}||${n.kelas}`;
          if (!nilaiPerSiswa[key]) nilaiPerSiswa[key] = { kuis: [], latihan: [] };
          nilaiPerSiswa[key].kuis.push(n.nilai || 0);
        });

        (listJawaban || []).forEach(j => {
          const key = `${j.nama_siswa}||${j.kelas}`;
          if (!nilaiPerSiswa[key]) nilaiPerSiswa[key] = { kuis: [], latihan: [] };
          nilaiPerSiswa[key].latihan.push(j.jawaban ? 1 : 0);
        });

        // Gabungkan dengan data siswa
        semuaNilai = semuaSiswa.map(s => {
          const key = `${s.nama}||${s.kelas}`;
          const data = nilaiPerSiswa[key] || { kuis: [], latihan: [] };

          const rataKuis = data.kuis.length > 0
            ? Math.round(data.kuis.reduce((a, b) => a + b, 0) / data.kuis.length)
            : null;

          const rataLatihan = data.latihan.length > 0
            ? Math.round((data.latihan.reduce((a, b) => a + b, 0) / data.latihan.length) * 100)
            : null;

          let akhir = null;
          if (rataKuis !== null && rataLatihan !== null) {
            akhir = Math.round((rataKuis + rataLatihan) / 2);
          } else if (rataKuis !== null) akhir = rataKuis;
          else if (rataLatihan !== null) akhir = rataLatihan;

          return {
            id: s.id,
            nama: s.nama,
            kelas: s.kelas,
            rataKuis,
            rataLatihan,
            akhir,
            pred: getPredikat(akhir)
          };
        });

        // Isi filter kelas
        const kelasSet = [...new Set(semuaSiswa.map(s => s.kelas).filter(Boolean))];
        const filterKelasEl = document.getElementById('filter-kelas-nilai');
        filterKelasEl.innerHTML = '<option value="">Semua Kelas</option>' +
          kelasSet.map(k => `<option value="${k}">${k}</option>`).join('');

        // Render tabel
        renderTabelGuru();

        // Update statistik guru (ringkasan)
        updateStatGuru();

      } catch (err) {
        console.error('Gagal load data guru:', err);
        showToast('Gagal memuat data: ' + err.message, 'error');
      }
    }

    // ============================================================
    // RENDER TABEL GURU
    // ============================================================
    function renderTabelGuru() {
      const tbody = document.querySelector('#tabel-nilai-guru tbody');
      if (!tbody) return;

      const q = filterKata.toLowerCase().trim();
      const kls = filterKelas;

      const filtered = semuaNilai.filter(s =>
        (!q || s.nama.toLowerCase().includes(q)) &&
        (!kls || s.kelas === kls)
      );

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <i class="fas fa-inbox"></i>
                <h3>Belum Ada Data</h3>
                <p>Tidak ada siswa yang cocok dengan filter.</p>
              </div>
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(s => `
        <tr>
          <td>
            <div class="cell-user">
              <div class="cell-avatar">${(s.nama || '?').charAt(0).toUpperCase()}</div>
              <div>
                <div class="cell-name">${s.nama}</div>
                <div class="cell-meta">NIS: ${s.nis || '-'}</div>
              </div>
            </div>
          </td>
          <td><strong>${s.kelas || '-'}</strong></td>
          <td>
            ${s.rataLatihan !== null
              ? `<span class="score-badge ${getScoreClass(s.rataLatihan)}">${s.rataLatihan}</span>`
              : '<span class="score-badge empty">—</span>'}
          </td>
          <td>
            ${s.rataKuis !== null
              ? `<span class="score-badge ${getScoreClass(s.rataKuis)}">${s.rataKuis}</span>`
              : '<span class="score-badge empty">—</span>'}
          </td>
          <td>
            ${s.akhir !== null
              ? `<span class="score-badge ${getScoreClass(s.akhir)}">${s.akhir}</span>`
              : '<span class="score-badge empty">—</span>'}
          </td>
          <td>
            <span class="predikat ${s.pred.class}">${s.pred.label}</span>
          </td>
        </tr>
      `).join('');
    }

    // ============================================================
    // STATISTIK GURU
    // ============================================================
    function updateStatGuru() {
      const denganNilai = semuaNilai.filter(s => s.akhir !== null);
      const rataKelas = denganNilai.length > 0
        ? Math.round(denganNilai.reduce((a, b) => a + b.akhir, 0) / denganNilai.length)
        : null;

      document.getElementById('stat-latihan').textContent = semuaNilai.filter(s => s.rataLatihan !== null).length;
      document.getElementById('stat-kuis').textContent = semuaNilai.filter(s => s.rataKuis !== null).length;
      document.getElementById('stat-akhir').textContent = rataKelas !== null ? rataKelas : '—';

      const pred = getPredikat(rataKelas);
      const predEl = document.getElementById('stat-predikat');
      predEl.textContent = pred.label;
      predEl.style.color =
        pred.class === 'a' ? 'var(--success)' :
        pred.class === 'b' ? 'var(--primary)' :
        pred.class === 'c' ? 'var(--accent)' :
        pred.class === 'd' ? 'var(--danger)' : 'var(--gray-500)';
    }

    // ============================================================
    // EXPORT CSV (GURU)
    // ============================================================
    function exportCSV() {
      if (semuaNilai.length === 0) {
        showToast('Belum ada data untuk di-export.', 'error');
        return;
      }

      const headers = ['Nama', 'Kelas', 'Nilai Latihan', 'Nilai Kuis', 'Nilai Akhir', 'Predikat'];
      const rows = semuaNilai.map(s => [
        s.nama,
        s.kelas,
        s.rataLatihan !== null ? s.rataLatihan : '',
        s.rataKuis !== null ? s.rataKuis : '',
        s.akhir !== null ? s.akhir : '',
        s.pred.label
      ]);

      const csv = [headers, ...rows]
        .map(r => r.map(cell => `"${cell}"`).join(','))
        .join('\n');

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `nilai-k3-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);

      showToast('File CSV berhasil di-download!', 'success');
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Halaman Nilai init');

      await cekRole();

      // Tampilkan view sesuai role
      if (currentRole === 'guru') {
        document.getElementById('view-guru').classList.add('active');
        await loadDataGuru();
      } else {
        document.getElementById('view-siswa').classList.add('active');
        await loadDataSiswa();
      }

      // Tombol back
      document.getElementById('back-btn').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = currentRole === 'guru' ? 'dashboard-guru.html' : 'dashboard-siswa.html';
      });

      // Filter guru
      document.getElementById('filter-nilai')?.addEventListener('input', (e) => {
        filterKata = e.target.value;
        renderTabelGuru();
      });

      document.getElementById('filter-kelas-nilai')?.addEventListener('change', (e) => {
        filterKelas = e.target.value;
        renderTabelGuru();
      });

      // Export CSV
      document.getElementById('btn-export-nilai')?.addEventListener('click', exportCSV);
    });
  </script>
