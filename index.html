<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Media Pembelajaran Interaktif K3 - Teknik Pemesinan SMK Negeri 2 Medan">
  <title>Login | Media Pembelajaran K3 — SMK Negeri 2 Medan</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ============================================================
       RESET & VARIABEL
       ============================================================ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --danger: #dc2626;
      --success: #16a34a;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2937;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.15);
      --radius: 14px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ============================================================
       DEKORASI BACKGROUND ANIMASI
       ============================================================ */
    .bg-decoration {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .bg-decoration::before,
    .bg-decoration::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      animation: float 20s infinite ease-in-out;
    }

    .bg-decoration::before {
      width: 500px;
      height: 500px;
      background: #3b82f6;
      top: -200px;
      left: -200px;
    }

    .bg-decoration::after {
      width: 400px;
      height: 400px;
      background: #f59e0b;
      bottom: -150px;
      right: -150px;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(50px, 50px) scale(1.1); }
    }

    /* ============================================================
       KARTU LOGIN
       ============================================================ */
    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 2.5rem 2.2rem;
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    /* ============================================================
       HEADER LOGIN
       ============================================================ */
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2rem;
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.35);
      animation: pulse 3s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .login-header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--gray-800);
      line-height: 1.3;
      margin-bottom: 0.4rem;
      letter-spacing: -0.02em;
    }

    .login-header .subtitle {
      font-size: 0.9rem;
      color: var(--gray-600);
      font-weight: 500;
      margin-bottom: 0.15rem;
    }

    .login-header .school {
      font-size: 0.78rem;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    /* ============================================================
       TAB PILIHAN PERAN
       ============================================================ */
    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: var(--gray-100);
      padding: 0.4rem;
      border-radius: 12px;
      margin-bottom: 1.6rem;
    }

    .role-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      border: none;
      background: transparent;
      border-radius: 9px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--gray-600);
      cursor: pointer;
      transition: var(--transition);
    }

    .role-tab i {
      font-size: 1rem;
    }

    .role-tab:hover:not(.active) {
      color: var(--primary);
      background: rgba(30, 64, 175, 0.05);
    }

    .role-tab.active {
      background: var(--white);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    /* ============================================================
       FORM
       ============================================================ */
    .form-group {
      margin-bottom: 1.1rem;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gray-800);
      margin-bottom: 0.4rem;
      letter-spacing: 0.01em;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i.field-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 0.95rem;
      pointer-events: none;
      transition: var(--transition);
    }

    .input-wrapper input {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      color: var(--gray-800);
      background: var(--white);
      transition: var(--transition);
      outline: none;
    }

    .input-wrapper input::placeholder {
      color: var(--gray-400);
      font-size: 0.88rem;
    }

    .input-wrapper input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30, 64, 175, 0.1);
    }

    .input-wrapper input:focus ~ i.field-icon {
      color: var(--primary);
    }

    .input-wrapper input:valid:not(:placeholder-shown) {
      border-color: rgba(22, 163, 74, 0.5);
    }

    /* Tombol lihat password */
    .toggle-password {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--gray-400);
      cursor: pointer;
      font-size: 0.95rem;
      padding: 0.3rem;
      transition: var(--transition);
    }

    .toggle-password:hover {
      color: var(--primary);
    }

    /* ============================================================
       REMEMBER & FORGOT
       ============================================================ */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.4rem;
      font-size: 0.82rem;
    }

    .checkbox-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      color: var(--gray-600);
      font-weight: 500;
    }

    .checkbox-wrapper input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      transition: var(--transition);
    }

    .forgot-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* ============================================================
       TOMBOL UTAMA
       ============================================================ */
    .btn-login {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 6px 16px rgba(30, 64, 175, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      position: relative;
      overflow: hidden;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(30, 64, 175, 0.4);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Spinner loading */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text  { display: none; }

    /* ============================================================
       DIVIDER & FOOTER
       ============================================================ */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.5rem 0 1rem;
      color: var(--gray-400);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .register-text {
      text-align: center;
      font-size: 0.85rem;
      color: var(--gray-600);
    }

    .register-text a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
      transition: var(--transition);
    }

    .register-text a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* ============================================================
       FOOTER COPYRIGHT
       ============================================================ */
    .copyright {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 0.02em;
    }

    /* ============================================================
       ALERT / TOAST NOTIFIKASI
       ============================================================ */
    .toast {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: white;
      padding: 1rem 1.3rem;
      border-radius: 10px;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      font-weight: 500;
      z-index: 9999;
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      max-width: 340px;
    }

    .toast.show { transform: translateX(0); }

    .toast i { font-size: 1.2rem; }
    .toast.error   { border-left: 4px solid var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.success i { color: var(--success); }
    .toast.info    { border-left: 4px solid var(--primary); }
    .toast.info i  { color: var(--primary); }

    /* ============================================================
       MODAL REGISTRASI
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 1rem;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-box {
      background: white;
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.3s ease;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-box h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 0.4rem;
    }

    .modal-box .modal-desc {
      font-size: 0.85rem;
      color: var(--gray-600);
      margin-bottom: 1.5rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.6rem;
      margin-top: 1.5rem;
    }

    .modal-actions button {
      flex: 1;
      padding: 0.8rem;
      border-radius: 10px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-600);
    }

    .btn-secondary:hover { background: var(--gray-200); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .login-card { padding: 2rem 1.5rem; }
      .login-header h1 { font-size: 1.15rem; }
      .brand-icon { width: 60px; height: 60px; font-size: 1.6rem; }
      .toast { right: 0.75rem; left: 0.75rem; max-width: none; }
    }
  </style>
</head>
<body data-page="login">

  <!-- Dekorasi background -->
  <div class="bg-decoration"></div>

  <!-- Toast notifikasi -->
  <div id="toast" class="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toast-message">Pesan</span>
  </div>

  <!-- Kartu login -->
  <div class="login-wrapper">
    <div class="login-card">

      <!-- Header -->
      <div class="login-header">
        <div class="brand-icon">
          <i class="fas fa-hard-hat"></i>
        </div>
        <h1>Media Pembelajaran Interaktif K3</h1>
        <p class="subtitle">Keselamatan &amp; Kesehatan Kerja</p>
        <p class="school">Teknik Pemesinan — SMK Negeri 2 Medan</p>
      </div>

      <!-- Tab peran -->
      <div class="role-tabs">
        <button type="button" class="role-tab active" data-role="siswa">
          <i class="fas fa-user-graduate"></i> Siswa
        </button>
        <button type="button" class="role-tab" data-role="guru">
          <i class="fas fa-chalkboard-user"></i> Guru
        </button>
      </div>

      <!-- Form login -->
      <form id="login-form" autocomplete="on">
        <input type="hidden" id="role" value="siswa">

        <!-- Email -->
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              placeholder="nama@email.com"
              autocomplete="email"
              required
            >
            <i class="fas fa-envelope field-icon"></i>
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Masukkan password"
              autocomplete="current-password"
              minlength="6"
              required
            >
            <i class="fas fa-lock field-icon"></i>
            <button
              type="button"
              class="toggle-password"
              id="toggle-password"
              aria-label="Tampilkan password"
            >
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Opsi tambahan -->
        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" id="remember-me">
            <span>Ingat saya</span>
          </label>
          <a href="#" class="forgot-link" id="forgot-link">Lupa password?</a>
        </div>

        <!-- Tombol login -->
        <button type="submit" class="btn-login" id="btn-login">
          <span class="spinner"></span>
          <span class="btn-text">
            <i class="fas fa-sign-in-alt"></i> Masuk
          </span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">atau</div>

      <!-- Link registrasi -->
      <p class="register-text">
        Belum punya akun?
        <a href="#" id="register-link">Daftar sekarang</a>
      </p>
    </div>

    <!-- Copyright -->
    <p class="copyright">
      © 2026 SMK Negeri 2 Medan — Media Pembelajaran K3
    </p>
  </div>

  <!-- Modal registrasi -->
  <div class="modal-overlay" id="modal-register">
    <div class="modal-box">
      <h2><i class="fas fa-user-plus"></i> Daftar Akun Baru</h2>
      <p class="modal-desc">Isi data di bawah ini untuk membuat akun.</p>

      <div class="form-group">
        <label for="reg-name">Nama Lengkap</label>
        <div class="input-wrapper">
          <input type="text" id="reg-name" placeholder="Nama lengkap" required>
          <i class="fas fa-user field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="reg-email" placeholder="nama@email.com" required>
          <i class="fas fa-envelope field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="reg-password" placeholder="Min. 6 karakter" minlength="6" required>
          <i class="fas fa-lock field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-role">Peran</label>
        <div class="input-wrapper">
          <select id="reg-role" style="width:100%;padding:0.85rem 1rem 0.85rem 2.75rem;border:1.5px solid var(--gray-200);border-radius:10px;font-family:inherit;font-size:0.92rem;background:white;outline:none;">
            <option value="siswa">Siswa</option>
            <option value="guru">Guru</option>
          </select>
          <i class="fas fa-id-badge field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-nisnip">NIS / NIP (opsional)</label>
        <div class="input-wrapper">
          <input type="text" id="reg-nisnip" placeholder="Nomor induk">
          <i class="fas fa-hashtag field-icon"></i>
        </div>
      </div>

      <div class="form-group">
        <label for="reg-kelas">Kelas (khusus siswa)</label>
        <div class="input-wrapper">
          <input type="text" id="reg-kelas" placeholder="Contoh: XII TP 1">
          <i class="fas fa-school field-icon"></i>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="btn-cancel-register">Batal</button>
        <button type="button" class="btn-login" id="btn-submit-register" style="flex:1;">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-check"></i> Daftar</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App JS (semua logika) -->
  <script src="js/app.js"></script>
</body>
</html>
