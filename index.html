<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Media Pembelajaran K3</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 2.5rem 2.2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 520px;
    }

    .login-header { text-align: center; margin-bottom: 2rem; }

    .brand-icon {
      width: 72px; height: 72px;
      margin: 0 auto 1rem;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 2rem;
    }

    .login-header h1 { font-size: 1.35rem; font-weight: 800; color: #1f2937; margin-bottom: 0.4rem; }
    .login-header .subtitle { font-size: 0.9rem; color: #4b5563; font-weight: 500; }
    .login-header .school { font-size: 0.78rem; color: #1e40af; font-weight: 600; text-transform: uppercase; }

    .step { display: none; }
    .step.active { display: block; }

    .step-title { text-align: center; margin-bottom: 1.5rem; }
    .step-title h2 { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 0.3rem; }
    .step-title p  { font-size: 0.85rem; color: #4b5563; }

    .role-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .role-choice {
      background: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 1.8rem 1rem;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      display: flex; flex-direction: column; align-items: center;
      gap: 0.8rem;
      transition: all 0.3s;
    }

    .role-choice.siswa:hover {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white;
      border-color: transparent;
      transform: translateY(-5px);
    }

    .role-choice.guru:hover {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      border-color: transparent;
      transform: translateY(-5px);
    }

    .role-choice:hover .role-choice-label,
    .role-choice:hover .role-choice-desc { color: white; }

    .role-choice-icon {
      width: 80px; height: 80px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
    }
    .role-choice.siswa .role-choice-icon { background: #dbeafe; color: #1e40af; }
    .role-choice.guru .role-choice-icon  { background: #e9d5ff; color: #7c3aed; }
    .role-choice:hover .role-choice-icon { background: rgba(255,255,255,0.25); color: white; }

    .role-choice-label { font-size: 1.1rem; font-weight: 800; color: #1f2937; }
    .role-choice-desc  { font-size: 0.75rem; color: #4b5563; font-weight: 500; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: none; border: none;
      color: #4b5563; font-family: inherit; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; padding: 0.4rem 0; margin-bottom: 1rem;
    }
    .back-btn:hover { color: #1e40af; }

    .role-badge {
      display: inline-flex; align-items: center; gap: 0.45rem;
      padding: 0.4rem 0.9rem; border-radius: 999px;
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      margin-bottom: 1.2rem;
    }
    .role-badge.siswa { background: #dbeafe; color: #1e40af; }
    .role-badge.guru  { background: #e9d5ff; color: #7c3aed; }

    .form-group { margin-bottom: 1.1rem; position: relative; }
    .form-group label {
      display: block; font-size: 0.82rem; font-weight: 600;
      color: #1f2937; margin-bottom: 0.4rem;
    }

    .input-wrapper { position: relative; }
    .input-wrapper i.field-icon {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: #9ca3af; font-size: 0.95rem;
      pointer-events: none;
    }

    .input-wrapper input,
    .input-wrapper select {
      width: 100%;
      padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-family: inherit; font-size: 0.92rem;
      color: #1f2937; background: white;
      outline: none;
    }
    .input-wrapper select { cursor: pointer; padding-right: 2.5rem; }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: #1e40af;
      box-shadow: 0 0 0 4px rgba(30,64,175,0.1);
    }

    .toggle-password {
      position: absolute; right: 0.9rem; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: #9ca3af; cursor: pointer;
      font-size: 0.95rem; padding: 0.3rem;
    }

    .btn-login {
      width: 100%; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white; border: none; border-radius: 10px;
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 0.6rem;
      margin-top: 0.5rem;
      transition: all 0.3s;
    }
    .btn-login.guru { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }

    .register-hint {
      text-align: center; font-size: 0.85rem;
      color: #4b5563; margin-top: 1.2rem;
      padding-top: 1.2rem;
      border-top: 1px dashed #e5e7eb;
    }
    .register-hint a { color: #7c3aed; font-weight: 700; cursor: pointer; text-decoration: none; }

    .toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: white; padding: 1rem 1.3rem;
      border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.88rem; font-weight: 500;
      z-index: 9999;
      transform: translateX(400px);
      transition: transform 0.4s;
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); }
    .toast i { font-size: 1.2rem; }
    .toast.error   { border-left: 4px solid #dc2626; }
    .toast.error i { color: #dc2626; }
    .toast.success { border-left: 4px solid #16a34a; }
    .toast.success i { color: #16a34a; }
    .toast.info    { border-left: 4px solid #1e40af; }
    .toast.info i  { color: #1e40af; }
  </style>
</head>
<body data-page="login">

  <div id="toast" class="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toast-message">Pesan</span>
  </div>

  <div class="login-card">

    <div class="login-header">
      <div class="brand-icon"><i class="fas fa-hard-hat"></i></div>
      <h1>Media Pembelajaran Interaktif K3</h1>
      <p class="subtitle">Keselamatan &amp; Kesehatan Kerja</p>
      <p class="school">Teknik Pemesinan — SMK Negeri 2 Medan</p>
    </div>

    <!-- STEP 1: Pilih Peran -->
    <div id="step-role" class="step active">
      <div class="step-title">
        <h2>Pilih Peran Anda</h2>
        <p>Masuk sebagai Siswa atau Guru</p>
      </div>

      <div class="role-choice-grid">
        <button type="button" class="role-choice siswa" id="choose-siswa">
          <div class="role-choice-icon"><i class="fas fa-user-graduate"></i></div>
          <div class="role-choice-label">Siswa</div>
          <div class="role-choice-desc">Nama &amp; Kelas</div>
        </button>

        <button type="button" class="role-choice guru" id="choose-guru">
          <div class="role-choice-icon"><i class="fas fa-chalkboard-user"></i></div>
          <div class="role-choice-label">Guru</div>
          <div class="role-choice-desc">Email &amp; Password</div>
        </button>
      </div>
    </div>

    <!-- STEP 2A: Login Siswa -->
    <div id="step-siswa" class="step">
      <button type="button" class="back-btn" id="back-from-siswa">
        <i class="fas fa-arrow-left"></i> Kembali
      </button>
      <div class="role-badge siswa"><i class="fas fa-user-graduate"></i> Login Siswa</div>

      <form id="login-form-siswa">
        <div class="form-group">
          <label for="siswa-nama">Pilih Nama</label>
          <div class="input-wrapper">
            <select id="siswa-nama" required>
              <option value="">-- Memuat... --</option>
            </select>
            <i class="fas fa-user field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="siswa-kelas">Kelas</label>
          <div class="input-wrapper">
            <select id="siswa-kelas" required>
              <option value="">-- Pilih Kelas --</option>
              <option value="X TP 1">X TP 1</option>
              <option value="X TP 2">X TP 2</option>
              <option value="X TP 3">X TP 3</option>
              <option value="XI TP 1">XI TP 1</option>
              <option value="XI TP 2">XI TP 2</option>
              <option value="XI TP 3">XI TP 3</option>
              <option value="XII TP 1">XII TP 1</option>
              <option value="XII TP 2">XII TP 2</option>
              <option value="XII TP 3">XII TP 3</option>
            </select>
            <i class="fas fa-school field-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login-siswa">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Masuk</span>
        </button>
      </form>
    </div>

    <!-- STEP 2B: Login Guru -->
    <div id="step-guru" class="step">
      <button type="button" class="back-btn" id="back-from-guru">
        <i class="fas fa-arrow-left"></i> Kembali
      </button>
      <div class="role-badge guru"><i class="fas fa-chalkboard-user"></i> Login Guru</div>

      <form id="login-form-guru">
        <div class="form-group">
          <label for="guru-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="guru-email" placeholder="guru@k3medan.com" required>
            <i class="fas fa-envelope field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="guru-password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="guru-password" placeholder="Masukkan password" required>
            <i class="fas fa-lock field-icon"></i>
            <button type="button" class="toggle-password" id="toggle-password-guru">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login guru" id="btn-login-guru">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Masuk</span>
        </button>
      </form>

      <div class="register-hint">
        Belum punya akun guru? <a id="link-register-guru">Daftar di sini</a>
      </div>
    </div>

    <!-- STEP 2C: Daftar Guru -->
    <div id="step-register" class="step">
      <button type="button" class="back-btn" id="back-from-register">
        <i class="fas fa-arrow-left"></i> Kembali
      </button>
      <div class="role-badge guru"><i class="fas fa-user-plus"></i> Daftar Akun Guru</div>

      <form id="register-form-guru">
        <div class="form-group">
          <label for="reg-nama">Nama Lengkap</label>
          <div class="input-wrapper">
            <input type="text" id="reg-nama" placeholder="Contoh: Budi Santoso, S.Pd." required>
            <i class="fas fa-user field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-nip">NIP (opsional)</label>
          <div class="input-wrapper">
            <input type="text" id="reg-nip" placeholder="Nomor Induk Pegawai">
            <i class="fas fa-id-badge field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="reg-email" placeholder="guru@k3medan.com" required>
            <i class="fas fa-envelope field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" placeholder="Min. 6 karakter" required>
            <i class="fas fa-lock field-icon"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password-confirm">Konfirmasi Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password-confirm" placeholder="Ulangi password" required>
            <i class="fas fa-lock field-icon"></i>
          </div>
        </div>

        <button type="submit" class="btn-login guru" id="btn-register-guru">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-user-plus"></i> Daftar</span>
        </button>
      </form>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/app.js"></script>
</body>
</html>
