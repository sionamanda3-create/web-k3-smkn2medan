<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login Media Pembelajaran K3 - SMK Negeri 2 Medan">
  <title>Login | Media Pembelajaran K3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #3b82f6 100%);
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 1.5rem; overflow: hidden; position: relative;
    }
    .bg-shape {
      position: fixed; border-radius: 50%; background: rgba(255,255,255,0.05);
      animation: float 8s ease-in-out infinite; pointer-events: none; z-index: 0;
    }
    .bg-shape.one   { width: 300px; height: 300px; top: -80px; right: -60px; }
    .bg-shape.two   { width: 200px; height: 200px; bottom: -50px; left: -50px; animation-delay: 2s; }
    .bg-shape.three { width: 150px; height: 150px; top: 40%; left: 10%; animation-delay: 4s; }
    .bg-shape.four  { width: 100px; height: 100px; bottom: 20%; right: 15%; animation-delay: 1s; }
    @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-30px) scale(1.1); } }
    .login-card {
      background: #ffffff; border-radius: 20px; padding: 2.5rem 2.2rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25); width: 100%; max-width: 520px;
      position: relative; z-index: 1; animation: slideUp 0.6s cubic-bezier(0.68,-0.55,0.27,1.55);
    }
    @keyframes slideUp { from { opacity:0; transform: translateY(40px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    .login-header { text-align: center; margin-bottom: 2rem; }
    .brand-icon {
      width: 76px; height: 76px; margin: 0 auto 1rem;
      background: linear-gradient(135deg, #1e40af, #3b82f6); border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 2rem; box-shadow: 0 10px 25px rgba(30,64,175,0.35);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .login-header h1 { font-size: 1.35rem; font-weight: 800; color: #1f2937; margin-bottom: 0.4rem; }
    .login-header .subtitle { font-size: 0.9rem; color: #4b5563; font-weight: 500; }
    .login-header .school { font-size: 0.78rem; color: #1e40af; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.3rem; }
    .step { display: none; }
    .step.active { display: block; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    .step-title { text-align: center; margin-bottom: 1.5rem; }
    .step-title h2 { font-size: 1.1rem; font-weight: 700; color: #1f2937; margin-bottom: 0.3rem; }
    .step-title p  { font-size: 0.85rem; color: #4b5563; }
    .role-choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .role-choice {
      background: #ffffff; border: 2px solid #e5e7eb; border-radius: 16px;
      padding: 2rem 1rem; cursor: pointer; text-align: center; font-family: inherit;
      display: flex; flex-direction: column; align-items: center; gap: 0.8rem;
      transition: all 0.35s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden;
    }
    .role-choice::before { content:''; position:absolute; inset:0; opacity:0; transition: opacity 0.35s; z-index: 0; }
    .role-choice.siswa::before { background: linear-gradient(135deg, #1e40af, #3b82f6); }
    .role-choice.guru::before  { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .role-choice:hover::before { opacity: 1; }
    .role-choice > * { position: relative; z-index: 1; }
    .role-choice:hover { transform: translateY(-6px) scale(1.02); border-color: transparent; box-shadow: 0 15px 30px rgba(30,64,175,0.3); }
    .role-choice.guru:hover { box-shadow: 0 15px 30px rgba(124,58,237,0.3); }
    .role-choice:hover .role-choice-label, .role-choice:hover .role-choice-desc { color: white; }
    .role-choice-icon { width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; transition: all 0.35s; }
    .role-choice.siswa .role-choice-icon { background: #dbeafe; color: #1e40af; }
    .role-choice.guru .role-choice-icon  { background: #e9d5ff; color: #7c3aed; }
    .role-choice:hover .role-choice-icon { background: rgba(255,255,255,0.25); color: white; }
    .role-choice-label { font-size: 1.1rem; font-weight: 800; color: #1f2937; transition: color 0.3s; }
    .role-choice-desc  { font-size: 0.75rem; color: #4b5563; font-weight: 500; transition: color 0.3s; }
    .form-group { margin-bottom: 1.1rem; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 700; color: #1f2937; margin-bottom: 0.45rem; }
    .input-wrapper { position: relative; }
    .input-wrapper i.field-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 0.95rem; pointer-events: none; }
    .input-wrapper input, .input-wrapper select {
      width: 100%; padding: 0.85rem 1rem 0.85rem 2.75rem;
      border: 1.5px solid #e5e7eb; border-radius: 10px;
      font-family: inherit; font-size: 0.92rem; color: #1f2937; background: white;
      outline: none; transition: all 0.25s;
    }
    .input-wrapper input:focus, .input-wrapper select:focus { border-color: #1e40af; box-shadow: 0 0 0 4px rgba(30,64,175,0.1); }
    .toggle-password { position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 0.95rem; padding: 0.3rem; }
    .toggle-password:hover { color: #1e40af; }
    .btn-login {
      width: 100%; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      color: white; border: none; border-radius: 12px;
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.6rem;
      margin-top: 0.5rem; transition: all 0.3s;
    }
    .btn-login.guru { background: linear-gradient(135deg, #7c3aed, #a855f7); }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,64,175,0.35); }
    .btn-login.guru:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(124,58,237,0.35); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: none; border: none; color: #4b5563;
      font-family: inherit; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; padding: 0.4rem 0; margin-bottom: 1rem;
    }
    .back-btn:hover { color: #1e40af; }
    .spinner {
      display: none; width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3); border-top-color: white;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-login.loading .spinner { display: inline-block; }
    .btn-login.loading .btn-text { display: none; }
    .toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: white; padding: 1rem 1.3rem;
      border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.88rem; font-weight: 500; z-index: 9999;
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); }
    .toast i { font-size: 1.2rem; }
    .toast.error   { border-left: 4px solid #dc2626; }
    .toast.error i { color: #dc2626; }
    .toast.success { border-left: 4px solid #16a34a; }
    .toast.success i { color: #16a34a; }
    .toast.info    { border-left: 4px solid #1e40af; }
    .toast.info i  { color: #1e40af; }
    @media (max-width: 480px) {
      .login-card { padding: 1.8rem 1.3rem; }
      .brand-icon { width: 64px; height: 64px; font-size: 1.6rem; }
      .login-header h1 { font-size: 1.15rem; }
      .role-choice-icon { width: 60px; height: 60px; font-size: 1.6rem; }
      .role-choice { padding: 1.5rem 0.8rem; }
      .toast { right: 0.75rem; left: 0.75rem; max-width: none; }
    }
  </style>
</head>
<body data-page="login">

  <div class="bg-shape one"></div>
  <div class="bg-shape two"></div>
  <div class="bg-shape three"></div>
  <div class="bg-shape four"></div>

  <div id="toast" class="toast">
    <i class="fas fa-info-circle"></i>
    <span id="toast-message">Pesan</span>
  </div>

  <div class="login-card">
    <div class="login-header">
      <div class="brand-icon"><i class="fas fa-hard-hat"></i></div>
      <h1>Media Pembelajaran Interaktif K3</h1>
      <p class="subtitle">Keselamatan &amp; Kesehatan Kerja</p>
      <p class="school">Teknik Pemesinan — SMK Negeri 2 Medan</p>
    </div>

    <!-- STEP 1 -->
    <div id="step-role" class="step active">
      <div class="step-title">
        <h2>Pilih Peran Anda</h2>
        <p>Masuk sebagai Siswa atau Guru</p>
      </div>
      <div class="role-choice-grid">
        <button type="button" class="role-choice siswa" id="choose-siswa">
          <div class="role-choice-icon"><i class="fas fa-user-graduate"></i></div>
          <div class="role-choice-label">Siswa</div>
          <div class="role-choice-desc">Nama &amp; Kelas</div>
        </button>
        <button type="button" class="role-choice guru" id="choose-guru">
          <div class="role-choice-icon"><i class="fas fa-chalkboard-user"></i></div>
          <div class="role-choice-label">Guru</div>
          <div class="role-choice-desc">Email &amp; Password</div>
        </button>
      </div>
    </div>

    <!-- STEP 2A: SISWA -->
    <div id="step-siswa" class="step">
      <button type="button" class="back-btn" id="back-from-siswa"><i class="fas fa-arrow-left"></i> Kembali</button>
      <div class="step-title">
        <h2>Masuk sebagai Siswa</h2>
        <p>Isi nama dan pilih kelas Anda</p>
      </div>
      <form id="login-form-siswa" autocomplete="off">
        <div class="form-group">
          <label for="siswa-nama">Nama Lengkap</label>
          <div class="input-wrapper">
            <input type="text" id="siswa-nama" placeholder="Contoh: Ahmad Rizki" required>
            <i class="fas fa-user field-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <label for="siswa-kelas">Kelas</label>
          <div class="input-wrapper">
            <select id="siswa-kelas" required>
              <option value="">-- Pilih Kelas --</option>
              <option value="X TP 1">X TP 1</option>
              <option value="X TP 2">X TP 2</option>
              <option value="X TP 3">X TP 3</option>
              <option value="XI TP 1">XI TP 1</option>
              <option value="XI TP 2">XI TP 2</option>
              <option value="XI TP 3">XI TP 3</option>
              <option value="XII TP 1">XII TP 1</option>
              <option value="XII TP 2">XII TP 2</option>
              <option value="XII TP 3">XII TP 3</option>
            </select>
            <i class="fas fa-school field-icon"></i>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btn-login-siswa">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Masuk</span>
        </button>
      </form>
    </div>

    <!-- STEP 2B: GURU -->
    <div id="step-guru" class="step">
      <button type="button" class="back-btn" id="back-from-guru"><i class="fas fa-arrow-left"></i> Kembali</button>
      <div class="step-title">
        <h2>Masuk sebagai Guru</h2>
        <p>Email apa saja bisa langsung login</p>
      </div>
      <form id="login-form-guru" autocomplete="off">
        <div class="form-group">
          <label for="guru-email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="guru-email" placeholder="guru@k3medan.com" required>
            <i class="fas fa-envelope field-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <label for="guru-password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="guru-password" placeholder="Minimal 6 karakter" required>
            <i class="fas fa-lock field-icon"></i>
            <button type="button" class="toggle-password" id="toggle-password-guru">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login guru" id="btn-login-guru">
          <span class="spinner"></span>
          <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Masuk</span>
        </button>
      </form>
    </div>
  </div>

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ddnhwcxfktcsyngupdex.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ogAtXLGklIivo88I41J8ZA_9CWzS8D3';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    console.log('✅ Supabase client siap');
  </script>

  <!-- LOGIC LOGIN -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('📄 Login page siap');

      function showStep(stepId) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(stepId)?.classList.add('active');
      }

      document.getElementById('choose-siswa')?.addEventListener('click', (e) => {
        e.preventDefault();
        showStep('step-siswa');
        setTimeout(() => document.getElementById('siswa-nama')?.focus(), 300);
      });

      document.getElementById('choose-guru')?.addEventListener('click', (e) => {
        e.preventDefault();
        showStep('step-guru');
        setTimeout(() => document.getElementById('guru-email')?.focus(), 300);
      });

      document.getElementById('back-from-siswa')?.addEventListener('click', () => showStep('step-role'));
      document.getElementById('back-from-guru')?.addEventListener('click', () => showStep('step-role'));

      const togglePwd = document.getElementById('toggle-password-guru');
      const pwdInput = document.getElementById('guru-password');
      if (togglePwd && pwdInput) {
        togglePwd.addEventListener('click', () => {
          const isPwd = pwdInput.type === 'password';
          pwdInput.type = isPwd ? 'text' : 'password';
          const icon = togglePwd.querySelector('i');
          if (icon) icon.className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
        });
      }

      function showToast(message, type = 'info') {
        const toast = document.getElementById('toast');
        const msg = document.getElementById('toast-message');
        if (!toast || !msg) { alert(message); return; }
        const icon = toast.querySelector('i');
        toast.className = 'toast ' + type;
        msg.textContent = message;
        const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
        if (icon) icon.className = 'fas ' + (icons[type] || icons.info);
        toast.classList.add('show');
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
      }

      // ============ LOGIN SISWA ============
      document.getElementById('login-form-siswa')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const nama = document.getElementById('siswa-nama').value.trim();
        const kelas = document.getElementById('siswa-kelas').value;
        const btn = document.getElementById('btn-login-siswa');

        if (!nama || !kelas) { showToast('Nama dan kelas wajib diisi!', 'error'); return; }
        if (nama.length < 3) { showToast('Nama minimal 3 karakter!', 'error'); return; }

        btn.classList.add('loading');
        btn.disabled = true;

        try {
          const { data: existing, error: checkErr } = await supabaseClient
            .from('siswa').select('*').eq('nama', nama).eq('kelas', kelas).maybeSingle();

          if (checkErr && checkErr.code !== 'PGRST116') throw checkErr;

          let siswaData;
          if (existing) {
            const { data: updated, error: updateErr } = await supabaseClient
              .from('siswa')
              .update({
                last_login: new Date().toISOString(),
                login_count: (existing.login_count || 0) + 1,
                status: 'aktif'
              })
              .eq('id', existing.id).select().single();
            if (updateErr) throw updateErr;
            siswaData = updated;
          } else {
            const { data: inserted, error: insertErr } = await supabaseClient
              .from('siswa')
              .insert([{
                nama, kelas,
                last_login: new Date().toISOString(),
                login_count: 1,
                status: 'aktif'
              }])
              .select().single();
            if (insertErr) throw insertErr;
            siswaData = inserted;
          }

          localStorage.setItem('siswa_session', JSON.stringify({
            id: siswaData.id,
            nama: siswaData.nama,
            kelas: siswaData.kelas,
            login_at: new Date().toISOString()
          }));

          showToast('Login berhasil! Selamat belajar, ' + nama, 'success');
          setTimeout(() => { window.location.href = 'dashboard-siswa.html'; }, 900);

        } catch (err) {
          console.error(err);
          showToast('Gagal login: ' + (err.message || 'Error'), 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      // ============ LOGIN GURU (AUTO-REGISTER) ============
      document.getElementById('login-form-guru')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        console.log('👨‍🏫 Login guru...');

        const email = document.getElementById('guru-email').value.trim();
        const password = document.getElementById('guru-password').value;
        const btn = document.getElementById('btn-login-guru');

        if (!email || !password) { showToast('Email dan password wajib diisi!', 'error'); return; }
        if (password.length < 6) { showToast('Password minimal 6 karakter!', 'error'); return; }

        btn.classList.add('loading');
        btn.disabled = true;

        try {
          // 1. Cek apakah email sudah terdaftar di tabel `guru`
          const { data: existing, error: checkErr } = await supabaseClient
            .from('guru').select('*').eq('email', email).maybeSingle();

          if (checkErr && checkErr.code !== 'PGRST116') throw checkErr;

          let guruData;

          if (existing) {
            // Cek password
            if (existing.password !== password) {
              showToast('Password salah untuk email ini!', 'error');
              btn.classList.remove('loading');
              btn.disabled = false;
              return;
            }

            // Update login count
            const { data: updated, error: updErr } = await supabaseClient
              .from('guru')
              .update({
                last_login: new Date().toISOString(),
                login_count: (existing.login_count || 0) + 1
              })
              .eq('id', existing.id).select().single();

            if (updErr) throw updErr;
            guruData = updated;
            console.log('✅ Guru existing login:', guruData);
          } else {
            // AUTO-REGISTER guru baru
            const namaDefault = email.split('@')[0]
              .replace(/[._]/g, ' ')
              .split(' ')
              .map(w => w.charAt(0).toUpperCase() + w.slice(1))
              .join(' ');

            const { data: inserted, error: insErr } = await supabaseClient
              .from('guru')
              .insert([{
                email, password,
                nama: namaDefault + ' (Guru)',
                login_count: 1,
                last_login: new Date().toISOString()
              }])
              .select().single();

            if (insErr) throw insErr;
            guruData = inserted;
            console.log('✅ Guru baru terdaftar:', guruData);
          }

          // Simpan session guru
          localStorage.setItem('guru_session', JSON.stringify({
            id: guruData.id,
            email: guruData.email,
            nama: guruData.nama,
            login_at: new Date().toISOString()
          }));

          showToast('Login berhasil! Halo ' + guruData.nama, 'success');
          setTimeout(() => { window.location.href = 'dashboard-guru.html'; }, 900);

        } catch (err) {
          console.error('❌ Error login guru:', err);
          showToast('Gagal login: ' + (err.message || 'Error'), 'error');
          btn.classList.remove('loading');
          btn.disabled = false;
        }
      });

      document.getElementById('siswa-nama')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          document.getElementById('siswa-kelas')?.focus();
        }
      });

      console.log('✅ Login page initialized');
    });
  </script>

</body>
</html>
