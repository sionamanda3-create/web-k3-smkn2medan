  <!-- ============================================================
       SCRIPT LATIHAN
       ============================================================ -->
  <script>
    // ============================================================
    // STATE
    // ============================================================
    let currentRole = 'siswa';
    let currentSiswa = null;
    let daftarLatihan = [];
    let latihanAktif = null;
    let soalList = [];
    let jawabanUser = {};      // { soalId: 'A' | 'B' | 'C' | 'D' | 'text essay' }
    let currentIndex = 0;
    let saveTimer = null;

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const msg = document.getElementById('toast-message');
      if (!toast || !msg) { alert(message); return; }
      const icon = toast.querySelector('i');
      toast.className = 'toast ' + type;
      msg.textContent = message;
      const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
      if (icon) icon.className = 'fas ' + (icons[type] || icons.info);
      toast.classList.add('show');
      clearTimeout(toast._timer);
      toast._timer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ============================================================
    // CEK ROLE
    // ============================================================
    async function cekRole() {
      const sessionSiswa = localStorage.getItem('siswa_session');
      if (sessionSiswa) {
        try {
          currentSiswa = JSON.parse(sessionSiswa);
          currentRole = 'siswa';
          document.getElementById('user-role').textContent = currentSiswa.nama || 'Siswa';
          document.getElementById('back-btn').href = 'dashboard-siswa.html';
          return;
        } catch (e) { /* lanjut */ }
      }

      const { data: { user } } = await supabaseClient.auth.getUser();
      if (user) {
        const { data: profile } = await supabaseClient
          .from('profiles').select('*').eq('id', user.id).single();

        if (profile?.role === 'guru') {
          currentRole = 'guru';
          document.getElementById('user-role').textContent = profile.full_name || 'Guru';
          document.getElementById('back-btn').href = 'dashboard-guru.html';
          document.getElementById('btn-add-latihan').style.display = 'inline-flex';
          return;
        }
      }

      window.location.href = 'index.html';
    }

    // ============================================================
    // LOAD DAFTAR LATIHAN
    // ============================================================
    async function loadLatihan() {
      const list = document.getElementById('latihan-list');
      list.innerHTML = `
        <div class="latihan-card">
          <div class="skeleton" style="height:52px;width:52px;border-radius:14px;"></div>
          <div class="skeleton" style="height:20px;width:80%;"></div>
          <div class="skeleton" style="height:14px;width:100%;"></div>
        </div>`;

      try {
        const { data, error } = await supabaseClient
          .from('latihan')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) throw error;

        daftarLatihan = (data || []).filter(l =>
          currentRole === 'guru' || l.status === 'aktif'
        );

        if (daftarLatihan.length === 0) {
          list.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1;">
              <i class="fas fa-inbox"></i>
              <h3>Belum Ada Latihan</h3>
              <p>${currentRole === 'guru' ? 'Klik "Buat Latihan Baru" untuk membuat latihan.' : 'Latihan akan muncul di sini setelah ditambahkan oleh guru.'}</p>
            </div>`;
          return;
        }

        // Cek latihan yang sudah dikerjakan
        let selesaiSet = new Set();
        if (currentRole === 'siswa' && currentSiswa) {
          const { data: logData } = await supabaseClient
            .from('aktivitas')
            .select('judul')
            .eq('siswa_id', currentSiswa.id)
            .eq('tipe', 'latihan')
            .eq('status', 'selesai');

          selesaiSet = new Set((logData || []).map(l => l.judul));
        }

        list.innerHTML = daftarLatihan.map(l => {
          const selesai = selesaiSet.has(l.judul);
          return `
            <div class="latihan-card">
              <div class="latihan-card-header">
                <div class="latihan-icon"><i class="fas fa-pen-to-square"></i></div>
                <span class="latihan-status ${selesai ? 'selesai' : 'baru'}">
                  ${selesai ? '<i class="fas fa-check"></i> Selesai' : '<i class="fas fa-play"></i> Tersedia'}
                </span>
              </div>
              <h3>${l.judul}</h3>
              <p class="desc">${l.deskripsi || 'Latihan soal untuk memperdalam pemahaman K3.'}</p>
              <div class="latihan-meta">
                <span class="latihan-meta-item"><i class="fas fa-list-ol"></i> ${l.jumlah_soal || 0} soal</span>
                <span class="latihan-meta-item"><i class="fas fa-pen"></i> Pilihan Ganda & Essay</span>
              </div>
              <div class="latihan-actions">
                ${currentRole === 'guru' ? `
                  <button class="btn btn-ghost" onclick="event.stopPropagation();hapusLatihan('${l.id}')">
                    <i class="fas fa-trash"></i> Hapus
                  </button>
                ` : ''}
                <button class="btn btn-success" onclick="mulaiLatihan('${l.id}')">
                  <i class="fas fa-play"></i> ${selesai ? 'Kerjakan Lagi' : 'Mulai Latihan'}
                </button>
              </div>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error('Gagal load latihan:', err);
        list.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Gagal Memuat Latihan</h3>
            <p>Terjadi kesalahan saat memuat data.</p>
          </div>`;
      }
    }

    // ============================================================
    // MULAI LATIHAN
    // ============================================================
    async function mulaiLatihan(latihanId) {
      const latihan = daftarLatihan.find(l => l.id === latihanId);
      if (!latihan) return;

      latihanAktif = latihan;
      jawabanUser = {};
      currentIndex = 0;

      try {
        const { data, error } = await supabaseClient
          .from('soal_latihan')
          .select('*')
          .eq('latihan_id', latihanId)
          .order('urutan', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          showToast('Latihan ini belum memiliki soal.', 'error');
          return;
        }

        soalList = data;

        // Pindah ke mode latihan
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('quiz-view').classList.add('active');
        document.getElementById('exercise-title').textContent = latihan.judul;
        document.getElementById('progress-total').textContent = soalList.length;

        renderSoal();
        renderNavigator();
        updateProgress();

        window.scrollTo({ top: 0, behavior: 'smooth' });

      } catch (err) {
        console.error('Gagal load soal latihan:', err);
        showToast('Gagal memuat soal: ' + err.message, 'error');
      }
    }

    // ============================================================
    // RENDER SOAL (Pilihan Ganda atau Essay)
    // ============================================================
    function renderSoal() {
      const soal = soalList[currentIndex];
      if (!soal) return;

      document.getElementById('q-number').textContent = currentIndex + 1;
      document.getElementById('q-text').textContent = soal.pertanyaan;

      const isEssay = soal.tipe === 'essay';
      const typeEl = document.getElementById('q-type');
      const optionsContainer = document.getElementById('q-options-container');

      if (isEssay) {
        // Essay
        typeEl.innerHTML = '<i class="fas fa-pen-fancy"></i> Essay';
        const jawaban = jawabanUser[soal.id] || '';
        optionsContainer.innerHTML = `
          <div class="essay-wrapper">
            <label for="essay-answer">Jawabanmu:</label>
            <textarea id="essay-answer" placeholder="Tulis jawabanmu di sini...">${jawaban}</textarea>
            <div class="essay-hint">
              <i class="fas fa-info-circle"></i>
              Jawaban akan diperiksa oleh guru.
            </div>
          </div>
        `;

        const textarea = document.getElementById('essay-answer');
        textarea.addEventListener('input', () => {
          jawabanUser[soal.id] = textarea.value;
          debouncedSave();
          renderNavigator();
          updateProgress();
        });

      } else {
        // Pilihan ganda
        typeEl.innerHTML = '<i class="fas fa-check-circle"></i> Pilihan Ganda';
        const selected = jawabanUser[soal.id];
        const opts = [
          { key: 'A', text: soal.pilihan_a },
          { key: 'B', text: soal.pilihan_b },
          { key: 'C', text: soal.pilihan_c },
          { key: 'D', text: soal.pilihan_d }
        ].filter(o => o.text);

        optionsContainer.innerHTML = `
          <div class="options-list">
            ${opts.map(o => `
              <label class="option-item ${selected === o.key ? 'selected' : ''}" data-key="${o.key}">
                <input type="radio" name="jawaban" value="${o.key}" ${selected === o.key ? 'checked' : ''}>
                <span class="option-letter">${o.key}</span>
                <span>${o.text}</span>
              </label>
            `).join('')}
          </div>
        `;

        document.querySelectorAll('.option-item').forEach(el => {
          el.addEventListener('click', () => {
            jawabanUser[soal.id] = el.dataset.key;
            document.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
            el.classList.add('selected');
            debouncedSave();
            renderNavigator();
            updateProgress();
          });
        });
      }

      // Update tombol
      document.getElementById('btn-prev').disabled = (currentIndex === 0);
      const isLast = currentIndex === soalList.length - 1;
      document.getElementById('btn-next').style.display = isLast ? 'none' : 'inline-flex';

      document.getElementById('progress-current').textContent = currentIndex + 1;
      updateProgress();
    }

    // ============================================================
    // UPDATE PROGRESS
    // ============================================================
    function updateProgress() {
      const total = soalList.length;
      const dijawab = Object.keys(jawabanUser).filter(k => {
        const v = jawabanUser[k];
        return v !== '' && v !== null && v !== undefined;
      }).length;
      const persen = total > 0 ? Math.round((dijawab / total) * 100) : 0;

      document.getElementById('progress-percent').textContent = persen + '%';
      document.getElementById('progress-fill').style.width = persen + '%';
      document.getElementById('exercise-subtitle').textContent = `Soal ${currentIndex + 1} dari ${total}`;
    }

    // ============================================================
    // RENDER NAVIGATOR
    // ============================================================
    function renderNavigator() {
      const nav = document.getElementById('question-nav');
      nav.innerHTML = soalList.map((s, i) => {
        const val = jawabanUser[s.id];
        const answered = (val !== '' && val !== undefined && val !== null) ? 'answered' : '';
        const current = i === currentIndex ? 'current' : '';
        return `<button class="q-nav-btn ${answered} ${current}" onclick="gotoSoal(${i})">${i + 1}</button>`;
      }).join('');
    }

    function gotoSoal(i) {
      if (i < 0 || i >= soalList.length) return;
      currentIndex = i;
      renderSoal();
      renderNavigator();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // AUTO-SAVE (indikator)
    // ============================================================
    function debouncedSave() {
      const indicator = document.getElementById('save-indicator');
      const text = document.getElementById('save-text');

      indicator.className = 'save-indicator saving';
      text.textContent = 'Menyimpan...';

      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        indicator.className = 'save-indicator saved';
        text.textContent = 'Tersimpan otomatis';
      }, 600);
    }

    // ============================================================
    // SELESAI LATIHAN
    // ============================================================
    async function selesaiLatihan() {
      const total = soalList.length;
      const dijawab = Object.keys(jawabanUser).filter(k => {
        const v = jawabanUser[k];
        return v !== '' && v !== null && v !== undefined;
      }).length;

      if (dijawab < total) {
        if (!confirm(`Masih ada ${total - dijawab} soal yang belum dijawab. Yakin ingin selesai?`)) return;
      }

      try {
        // Simpan jawaban ke tabel jawaban_latihan
        const inserts = soalList.map(s => ({
          siswa_id: currentSiswa?.id || null,
          nama_siswa: currentSiswa?.nama || null,
          kelas: currentSiswa?.kelas || null,
          latihan_id: latihanAktif.id,
          soal_id: s.id,
          jawaban: jawabanUser[s.id] || '',
          created_at: new Date().toISOString()
        }));

        const { error } = await supabaseClient.from('jawaban_latihan').insert(inserts);
        if (error) throw error;

        // Log aktivitas
        if (currentSiswa) {
          await supabaseClient.from('aktivitas').insert([{
            siswa_id: currentSiswa.id,
            tipe: 'latihan',
            judul: latihanAktif.judul,
            status: 'selesai',
            created_at: new Date().toISOString()
          }]);
        }

        tampilkanHasilLatihan(total, dijawab);

      } catch (err) {
        console.error('Gagal simpan jawaban:', err);
        showToast('Gagal menyimpan jawaban: ' + err.message, 'error');
      }
    }

    function tampilkanHasilLatihan(total, dijawab) {
      document.getElementById('quiz-view').classList.remove('active');
      document.getElementById('result-view').classList.add('active');

      document.getElementById('result-total').textContent = total;
      document.getElementById('result-answered').textContent = dijawab;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // KEMBALI KE DAFTAR
    // ============================================================
    function kembaliKeDaftar() {
      document.getElementById('result-view').classList.remove('active');
      document.getElementById('quiz-view').classList.remove('active');
      document.getElementById('list-view').classList.remove('hidden');
      latihanAktif = null;
      soalList = [];
      jawabanUser = {};
      currentIndex = 0;
      loadLatihan();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ============================================================
    // HAPUS LATIHAN (GURU)
    // ============================================================
    async function hapusLatihan(id) {
      if (!confirm('Yakin ingin menghapus latihan ini?')) return;
      try {
        await supabaseClient.from('soal_latihan').delete().eq('latihan_id', id);
        const { error } = await supabaseClient.from('latihan').delete().eq('id', id);
        if (error) throw error;
        showToast('Latihan berhasil dihapus!', 'success');
        loadLatihan();
      } catch (err) {
        showToast('Gagal menghapus: ' + err.message, 'error');
      }
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Halaman Latihan init');

      await cekRole();
      await loadLatihan();

      document.getElementById('back-btn').addEventListener('click', (e) => {
        e.preventDefault();
        window.location.href = currentRole === 'guru' ? 'dashboard-guru.html' : 'dashboard-siswa.html';
      });

      document.getElementById('btn-prev').addEventListener('click', () => gotoSoal(currentIndex - 1));
      document.getElementById('btn-next').addEventListener('click', () => gotoSoal(currentIndex + 1));
      document.getElementById('btn-finish').addEventListener('click', selesaiLatihan);
      document.getElementById('btn-back-list').addEventListener('click', kembaliKeDaftar);
    });

    // Expose
    window.mulaiLatihan = mulaiLatihan;
    window.gotoSoal = gotoSoal;
    window.hapusLatihan = hapusLatihan;
  </script>
