
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Materi K3 - Media Pembelajaran K3 SMK Negeri 2 Medan">
  <title>Materi K3 | Media Pembelajaran K3</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* ============================================================
       RESET & VARIABEL
       ============================================================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #1e40af;
      --primary-dark: #1e3a8a;
      --primary-light: #3b82f6;
      --accent: #f59e0b;
      --danger: #dc2626;
      --success: #16a34a;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --white: #ffffff;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 12px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-50);
      color: var(--gray-800);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       NAVBAR
       ============================================================ */
    .navbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gray-200);
      padding: 0.9rem 1.5rem;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .navbar-left { display: flex; align-items: center; gap: 1rem; }

    .back-btn {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--gray-100); color: var(--gray-700);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; transition: var(--transition);
      font-size: 0.95rem;
    }
    .back-btn:hover {
      background: var(--primary); color: white;
      transform: translateX(-3px);
    }

    .navbar-brand {
      display: flex; align-items: center; gap: 0.6rem;
      font-weight: 800; font-size: 1.05rem; color: var(--primary);
      letter-spacing: -0.02em;
    }

    .navbar-brand .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1rem;
      box-shadow: 0 4px 10px rgba(30,64,175,0.3);
    }

    .navbar-right { display: flex; align-items: center; gap: 0.9rem; }

    .user-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem 0.8rem;
      background: var(--gray-100);
      border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; color: var(--gray-600);
    }

    /* ============================================================
       CONTAINER
       ============================================================ */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1.5rem 5rem;
    }

    /* ============================================================
       PAGE HEADER
       ============================================================ */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.8rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-title h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--gray-800);
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      display: flex; align-items: center; gap: 0.6rem;
    }

    .page-title h1 i { color: var(--primary); }

    .page-title p {
      font-size: 0.88rem;
      color: var(--gray-500);
      font-weight: 500;
    }

    /* ============================================================
       TOMBOL
       ============================================================ */
    .btn {
      padding: 0.75rem 1.3rem;
      border-radius: 10px;
      border: none;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 4px 12px rgba(30,64,175,0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(30,64,175,0.35);
    }

    .btn-ghost {
      background: var(--gray-100);
      color: var(--gray-700);
    }
    .btn-ghost:hover { background: var(--gray-200); }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }
    .btn-danger:hover { background: #fecaca; }

    .btn-sm {
      padding: 0.55rem 0.9rem;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* ============================================================
       TOOLBAR (Search & Filter)
       ============================================================ */
    .toolbar {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--gray-100);
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 220px;
    }

    .search-box i {
      position: absolute; left: 1rem; top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400); font-size: 0.9rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.6rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--gray-800);
      background: var(--white);
      transition: var(--transition);
      outline: none;
    }
    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30,64,175,0.1);
    }
    .search-box input::placeholder { color: var(--gray-400); }

    .view-toggle {
      display: flex;
      background: var(--gray-100);
      border-radius: 10px;
      padding: 0.25rem;
      gap: 0.2rem;
    }

    .view-toggle button {
      border: none;
      background: transparent;
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      color: var(--gray-500);
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.85rem;
    }
    .view-toggle button.active {
      background: white;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* ============================================================
       MATERI GRID (View: Grid)
       ============================================================ */
    .materi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.2rem;
    }

    .materi-grid.list-view-mode {
      grid-template-columns: 1fr;
    }

    .materi-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--gray-100);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      animation: slideUp 0.5s ease-out backwards;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
    }

    .materi-card:nth-child(1) { animation-delay: 0.05s; }
    .materi-card:nth-child(2) { animation-delay: 0.10s; }
    .materi-card:nth-child(3) { animation-delay: 0.15s; }
    .materi-card:nth-child(4) { animation-delay: 0.20s; }
    .materi-card:nth-child(5) { animation-delay: 0.25s; }
    .materi-card:nth-child(6) { animation-delay: 0.30s; }

    .materi-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary-light);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .materi-thumb {
      height: 120px;
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .materi-thumb::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 0%, transparent 50%);
    }

    .materi-thumb-icon {
      width: 60px; height: 60px;
      background: rgba(255,255,255,0.2);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.6rem;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .materi-order-badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      background: rgba(255,255,255,0.9);
      color: var(--primary);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.3rem 0.65rem;
      border-radius: 999px;
      z-index: 2;
    }

    .materi-read-badge {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      background: rgba(22,163,74,0.95);
      color: white;
      font-size: 0.65rem;
      font-weight: 800;
      padding: 0.3rem 0.6rem;
      border-radius: 999px;
      z-index: 2;
      display: none;
      align-items: center;
      gap: 0.3rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .materi-read-badge.show { display: inline-flex; }

    .materi-body {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .materi-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-800);
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .materi-excerpt {
      font-size: 0.83rem;
      color: var(--gray-500);
      line-height: 1.55;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .materi-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.8rem;
      border-top: 1px dashed var(--gray-200);
      margin-top: 0.4rem;
    }

    .materi-meta {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--gray-500);
    }
    .materi-meta i { color: var(--primary); font-size: 0.72rem; }

    .materi-actions {
      display: flex;
      gap: 0.35rem;
      opacity: 0;
      transition: var(--transition);
    }

    .materi-card:hover .materi-actions { opacity: 1; }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1.5px solid var(--gray-200);
      background: white;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.78rem;
    }

    .icon-btn:hover {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .icon-btn.danger:hover {
      background: var(--danger);
      border-color: var(--danger);
    }

    /* ============================================================
       LIST VIEW MODE
       ============================================================ */
    .materi-grid.list-view-mode .materi-card {
      flex-direction: row;
    }

    .materi-grid.list-view-mode .materi-thumb {
      width: 140px;
      height: auto;
      flex-shrink: 0;
    }

    .materi-grid.list-view-mode .materi-body {
      padding: 1.2rem 1.5rem;
    }

    .materi-grid.list-view-mode .materi-excerpt {
      -webkit-line-clamp: 3;
    }

    /* ============================================================
       EMPTY STATE
       ============================================================ */
    .empty-state {
      background: var(--white);
      border-radius: var(--radius);
      padding: 4rem 2rem;
      text-align: center;
      border: 2px dashed var(--gray-200);
      grid-column: 1 / -1;
    }

    .empty-state i {
      font-size: 3.5rem;
      color: var(--gray-300);
      margin-bottom: 1rem;
      display: block;
    }

    .empty-state h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gray-700);
      margin-bottom: 0.4rem;
    }

    .empty-state p {
      font-size: 0.88rem;
      color: var(--gray-500);
    }

    /* ============================================================
       SKELETON
       ============================================================ */
    .skeleton {
      background: linear-gradient(90deg, #f3f4f6 25%, #e5e7eb 50%, #f3f4f6 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ============================================================
       MODAL BACA MATERI
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      padding: 1rem;
      animation: fadeIn 0.2s ease;
    }

    .modal-overlay.show { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-reader {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 780px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.35s ease;
      overflow: hidden;
    }

    .modal-reader-header {
      padding: 1.5rem 2rem;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .modal-reader-header::before {
      content: '';
      position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      top: -80px; right: -60px;
    }

    .modal-reader-title {
      position: relative;
      z-index: 1;
    }

    .modal-reader-title h2 {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }

    .modal-reader-title .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      font-size: 0.75rem;
      font-weight: 500;
      opacity: 0.9;
    }

    .modal-reader-title .meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .btn-close-modal {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      font-size: 0.9rem;
    }

    .btn-close-modal:hover {
      background: rgba(255,255,255,0.35);
      transform: rotate(90deg);
    }

    .modal-reader-body {
      padding: 2rem;
      overflow-y: auto;
      line-height: 1.75;
      font-size: 0.95rem;
      color: var(--gray-700);
      flex: 1;
    }

    .modal-reader-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--gray-800);
      margin: 1.5rem 0 0.6rem;
    }

    .modal-reader-body h3:first-child { margin-top: 0; }

    .modal-reader-body p {
      margin-bottom: 1rem;
    }

    .modal-reader-body ul, .modal-reader-body ol {
      margin: 0 0 1rem 1.5rem;
      padding-left: 0.5rem;
    }

    .modal-reader-body li {
      margin-bottom: 0.4rem;
    }

    .modal-reader-body strong {
      color: var(--gray-800);
      font-weight: 700;
    }

    .modal-reader-body .callout {
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      padding: 1rem 1.2rem;
      border-radius: 8px;
      margin: 1.2rem 0;
      font-size: 0.9rem;
      color: #1e3a8a;
    }

    .modal-reader-body .callout.warning {
      background: #fef3c7;
      border-color: var(--accent);
      color: #92400e;
    }

    .modal-reader-footer {
      padding: 1.2rem 2rem;
      border-top: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.8rem;
      flex-shrink: 0;
      background: var(--gray-50);
      flex-wrap: wrap;
    }

    .modal-reader-footer .progress-read {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gray-500);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .modal-reader-footer .actions {
      display: flex;
      gap: 0.6rem;
      margin-left: auto;
    }

    /* ============================================================
       MODAL FORM (Guru)
       ============================================================ */
    .modal-form {
      background: white;
      border-radius: var(--radius);
      width: 100%;
      max-width: 620px;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.35s ease;
      overflow: hidden;
    }

    .modal-form-header {
      padding: 1.5rem 1.8rem;
      border-bottom: 1px solid var(--gray-100);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-form-header h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--gray-800);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-form-header h2 i { color: var(--primary); }

    .btn-close-x {
      width: 34px; height: 34px;
      border-radius: 10px;
      background: var(--gray-100);
      border: none;
      color: var(--gray-600);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      font-size: 0.85rem;
    }
    .btn-close-x:hover {
      background: var(--danger);
      color: white;
      transform: rotate(90deg);
    }

    .modal-form-body {
      padding: 1.8rem;
      overflow-y: auto;
      flex: 1;
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gray-700);
      margin-bottom: 0.45rem;
    }

    .form-group label .req { color: var(--danger); }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid var(--gray-200);
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--gray-800);
      transition: var(--transition);
      outline: none;
      background: white;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30,64,175,0.1);
    }

    .form-group textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .form-hint {
      font-size: 0.75rem;
      color: var(--gray-500);
      margin-top: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .modal-form-footer {
      padding: 1.2rem 1.8rem;
      border-top: 1px solid var(--gray-100);
      display: flex;
      justify-content: flex-end;
      gap: 0.7rem;
      background: var(--gray-50);
      flex-shrink: 0;
    }

    /* ============================================================
       TOAST
       ============================================================ */
    .toast {
      position: fixed; top: 1.5rem; right: 1.5rem;
      background: white; padding: 1rem 1.3rem;
      border-radius: 10px; box-shadow: var(--shadow-lg);
      display: flex; align-items: center; gap: 0.75rem;
      font-size: 0.88rem; font-weight: 500;
      z-index: 9999;
      transform: translateX(400px);
      transition: transform 0.4s cubic-bezier(0.68,-0.55,0.27,1.55);
      max-width: 340px;
    }
    .toast.show { transform: translateX(0); }
    .toast i { font-size: 1.2rem; }
    .toast.error   { border-left: 4px solid var(--danger); }
    .toast.error i { color: var(--danger); }
    .toast.success { border-left: 4px solid var(--success); }
    .toast.success i { color: var(--success); }
    .toast.info    { border-left: 4px solid var(--primary); }
    .toast.info i  { color: var(--primary); }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
